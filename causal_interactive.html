<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body { font-family: 'Microsoft YaHei', 'PingFang SC', -apple-system, sans-serif; background: #f5f6fa; color: #333; }
.header { background: linear-gradient(135deg, #1a237e 0%, #283593 100%); color: white; padding: 16px 28px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
.header h1 { font-size: 20px; font-weight: 600; letter-spacing: 1px; }
.header .stats { font-size: 13px; opacity: 0.85; }
.header .stats span { display: inline-block; margin-left: 16px; }
.layout { display: flex; height: calc(100vh - 60px); width: 100%; min-height: 500px; }
.toolbar { width: 300px; min-width: 300px; max-width: 300px; background: white; border-right: 1px solid #e0e0e0; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.toolbar-section { background: #fafafa; border-radius: 8px; padding: 14px; }
.toolbar-section h3 { font-size: 14px; font-weight: 600; margin-bottom: 10px; color: #333; border-bottom: 2px solid #e8eaf6; padding-bottom: 6px; }
.toolbar-section .btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
.toolbar-section button { padding: 6px 12px; border: 1px solid #ccc; border-radius: 4px; background: white; cursor: pointer; font-size: 12px; transition: all 0.2s; font-family: inherit; }
.toolbar-section button:hover { background: #e8eaf6; border-color: #7986cb; }
.toolbar-section button.active { background: #283593; color: white; border-color: #283593; }
.toolbar-section select { width: 100%; padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; font-family: inherit; }
.toolbar-section input[type="text"] { width: 100%; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; font-family: inherit; }
.detail-panel { background: #fff; border-radius: 8px; padding: 14px; flex-grow: 1; overflow-y: auto; max-height: 300px; font-size: 13px; line-height: 1.6; }
.detail-panel .empty { color: #999; text-align: center; padding: 30px 0; }
.detail-panel .item { padding: 6px 0; border-bottom: 1px dashed #eee; }
.detail-panel .item:last-child { border-bottom: none; }
.detail-panel .item .label { color: #666; font-size: 11px; }
.detail-panel .item .val { color: #333; font-weight: 500; }
.graph-container { flex: 1; height: 100%; position: relative; background: #fafbfc; }
#network { position: absolute; top: 0; left: 0; right: 0; bottom: 0; min-height: 400px; }
.legend { position: absolute; bottom: 16px; left: 16px; background: rgba(255,255,255,0.95); border-radius: 8px; padding: 10px 14px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); line-height: 1.8; }
.legend .row { display: flex; align-items: center; gap: 8px; }
.legend .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.legend .line { width: 24px; height: 3px; display: inline-block; border-radius: 2px; }
.legend .dash-line { border-top: 3px dashed #666; width: 24px; display: inline-block; }
.badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 11px; color: white; }
.badge-strong { background: #283593; }
.badge-reviewed { background: #2e7d32; }
.badge-pending { background: #e65100; }
/* 发言人画像相关 */
.persona-card { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 14px; margin-top: 6px; font-size: 12px; line-height: 1.7; }
.persona-card h4 { font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #1a237e; border-bottom: 1px solid #e8eaf6; padding-bottom: 4px; }
.persona-card .persona-stat { display: inline-block; margin-right: 12px; margin-bottom: 4px; }
.persona-card .persona-stat .label { color: #888; font-size: 11px; }
.persona-card .persona-stat .val { font-weight: 600; color: #333; }
.persona-bar { height: 8px; border-radius: 4px; background: #e8eaf6; overflow: hidden; margin: 2px 0; }
.persona-bar-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
.speaker-select { width: 100%; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; font-family: inherit; cursor: pointer; }
@media (max-width: 768px) { .layout { flex-direction: column; } .toolbar { width: 100%; min-width: auto; max-height: 40vh; border-right: none; border-bottom: 1px solid #e0e0e0; } }
</style>
</head>
<body>
<div class="header">
  <h1>五因子因果图谱交互看板</h1>
  <div class="stats">
    节点: <span class="badge" style="background:#283593">57</span>
    因果边: <span class="badge" style="background:#e65100">127</span>
    强: <span class="badge badge-strong">22</span>

</div>
<div class="layout">
  <div class="toolbar">

        <option value="4">[基本] 降息预期</option>
        <option value="5">[基本] 经济增长动能</option>
        <option value="6">[基本] 出口数据</option>
        <option value="7">[基本] 通胀</option>
        <option value="8">[基本] 配置力量入场</option>
        <option value="9">[政策] 基本面边际变化</option>
        <option value="10">[政策] 政策博弈</option>
        <option value="11">[政策] 政策目标函数</option>
        <option value="12">[政策] 关税影响</option>
        <option value="13">[政策] 利率区间管理</option>
        <option value="14">[政策] 央行态度与信号</option>
        <option value="15">[政策] 中美会晤</option>
        <option value="16">[政策] 反内卷政策影响</option>
        <option value="17">[政策] 财政节奏</option>
        <option value="25">[政策] 政策预期</option>
        <option value="50">[政策] 货币政策预期</option>
        <option value="18">[流动] 资金面判断</option>
        <option value="19">[流动] 央行投放节奏</option>
        <option value="20">[流动] 同业存单利率</option>
        <option value="21">[流动] 存单供需</option>
        <option value="22">[流动] 资金价格中枢</option>
        <option value="23">[流动] 配置节奏</option>
        <option value="49">[流动] 杠杆策略</option>
        <option value="24">[市场] 风险偏好变化</option>

const EDGE_SPEAKER_INDEX = {"FD_001→FD_005": [{"speaker": "沈文思", "text": "固定资产投资或受地产拖累，但基建投资有望保持韧性，成为稳增长重要支撑", "date": "2026-04-03"}, {"speaker": "高喆", "text": "经济模型维持9分偏弱判断但较上周略有好转", "date": "2026-04-10"}, {"speaker": "杨义山", "text": "宏观基本面韧性延续但缺乏强增长带动力", "date": "2026-04-10"}, {"speaker": "杨义山", "text": "目前韧性更多体现为环比延续而非强增长驱动", "date": "2026-04-10"}, {"speaker": "刘曼沁", "text": "后续更关键的仍是内需走弱是否逐步显性化", "date": "2026-04-10"}, {"speaker": "杨义山", "text": "基本面走弱稳增长压力上升，长端供需结构或改善但核心看政策强度。基金久期分歧极大。", "date": "2025-09-19"}, {"speaker": "沈文思", "text": "Q3 GDP或回落至4.8%，内需疲软。银行净息差压力制约降息，利率上有顶1.85%。", "date": "2025-09-19"}, {"speaker": "沈文思", "text": "基本面偏弱政策温和，低利率环境维持较长时间。10Y波动1.75%-1.85%难现系统性熊市。", "date": "2025-10-10"}, {"speaker": "沈文思", "text": "Q4 GDP约4.5%，增量政策必要性不高。三季度调整已修复透支预期，四季度利多略增。", "date": "2025-10-17"}], "FD_001→FD_003": [{"speaker": "沈文思", "text": "地产\"小阳春\"集中于上海及部分二线城市，呈现量升价稳特征", "date": "2026-04-03"}, {"speaker": "共识", "text": "一季度数据虽有亮点，但内生动能（尤其是地产和消费）仍偏弱，二季度增长动能可能环比放缓", "date": "2026-04-17"}, {"speaker": "沈文思", "text": "二季度宏观压力将进一步显化", "date": "2026-04-17"}, {"speaker": "沈文思", "text": "同比基数压力下增速或在4.6%～4.8%，环比动能将落于一季度", "date": "2026-04-17"}, {"speaker": "沈文思", "text": "居民部门仍然偏弱，信贷数据显示内生修复动能不稳，地产对投资的负向拖累延续", "date": "2026-04-17"}, {"speaker": "李博良", "text": "二季度基本面持续性存疑，去年一季度冲高后二季度历史上持续性本来就不好", "date": "2026-04-17"}, {"speaker": "张晶", "text": "上半年事件驱动性主导，下半年周期本身力量重要性提升。全球逐步确认经济见底。反内卷与供给侧改革有可比性但涉及面更广难度更大。短期情绪驱动不宜过度炒作。低波动率下季节性效应关注度提高，下半年研究环境更好。", "date": "2025-07-04"}, {"speaker": "张晶", "text": "市场主线趋同：股债跷跷板+权益市场走向。关注供给侧框架下反内卷政策效果。居民超额储蓄47万亿但未大规模流入股市，对比2014-2015年增量空间有限。长期债市受支撑但短期风偏压制显著，维持震荡偏空，股债双牛难现主因增量资金不足。", "date": "2025-07-18"}, {"speaker": "张晶", "text": "当前波动源于对终局化叙事的反思。产能过剩与通缩环境未根本改变。PPI维持-2%左右但幅度收窄。育儿政策可能对消费形成支撑。全球PMI共振回升叙事更值得警惕，可能对债市底层逻辑构成挑战。", "date": "2025-07-29"}, {"speaker": "沈文思", "text": "8月预计维持震荡。今年调整因素与往年不同：无降息预期也无资金收紧。出口阶段性企稳，PPI回弹显示基本面韧性。生育补贴象征意义可能超越实际效果，预期差与数据共振可能推动修复。", "date": "2025-07-29"}, {"speaker": "沈文思", "text": "7月数据全面不及预期但债市钝化。地产拖累减弱、出口未证伪、PPI触底。流动性宽松+情绪支撑利好股市风险偏好。股债跷跷板逻辑未变，利率易上难下。", "date": "2025-08-15"}], "FD_003→FD_005": [{"speaker": "沈文思", "text": "固定资产投资或受地产拖累，但基建投资有望保持韧性，成为稳增长重要支撑", "date": "2026-04-03"}, {"speaker": "高喆", "text": "经济模型维持9分偏弱判断但较上周略有好转", "date": "2026-04-10"}, {"speaker": "杨义山", "text": "宏观基本面韧性延续但缺乏强增长带动力", "date": "2026-04-10"}, {"speaker": "杨义山", "text": "目前韧性更多体现为环比延续而非强增长驱动", "date": "2026-04-10"}, {"speaker": "刘曼沁", "text": "后续更关键的仍是内需走弱是否逐步显性化", "date": "2026-04-10"}, {"speaker": "杨义山", "text": "基本面走弱稳增长压力上升，长端供需结构或改善但核心看政策强度。基金久期分歧极大。", "date": "2025-09-19"}, {"speaker": "沈文思", "text": "Q3 GDP或回落至4.8%，内需疲软。银行净息差压力制约降息，利率上有顶1.85%。", "date": "2025-09-19"}, {"speaker": "沈文思", "text": "基本面偏弱政策温和，低利率环境维持较长时间。10Y波动1.75%-1.85%难现系统性熊市。", "date": "2025-10-10"}, {"speaker": "沈文思", "text": "Q4 GDP约4.5%，增量政策必要性不高。三季度调整已修复透支预期，四季度利多略增。", "date": "2025-10-17"}], "FD_006→FD_005": [{"speaker": "沈文思", "text": "固定资产投资或受地产拖累，但基建投资有望保持韧性，成为稳增长重要支撑", "date": "2026-04-03"}, {"speaker": "高喆", "text": "经济模型维持9分偏弱判断但较上周略有好转", "date": "2026-04-10"}, {"speaker": "杨义山", "text": "宏观基本面韧性延续但缺乏强增长带动力", "date": "2026-04-10"}, {"speaker": "杨义山", "text": "目前韧性更多体现为环比延续而非强增长驱动", "date": "2026-04-10"}, {"speaker": "刘曼沁", "text": "后续更关键的仍是内需走弱是否逐步显性化", "date": "2026-04-10"}, {"speaker": "杨义山", "text": "基本面走弱稳增长压力上升，长端供需结构或改善但核心看政策强度。基金久期分歧极大。", "date": "2025-09-19"}, {"speaker": "沈文思", "text": "Q3 GDP或回落至4.8%，内需疲软。银行净息差压力制约降息，利率上有顶1.85%。", "date": "2025-09-19"}, {"speaker": "沈文思", "text": "基本面偏弱政策温和，低利率环境维持较长时间。10Y波动1.75%-1.85%难现系统性熊市。", "date": "2025-10-10"}, {"speaker": "沈文思", "text": "Q4 GDP约4.5%，增量政策必要性不高。三季度调整已修复透支预期，四季度利多略增。", "date": "2025-10-17"}], "FD_006→FD_001": [{"speaker": "张晶", "text": "基本面则因高度不确定环境持续给予2分评级", "date": "2026-04-03"}, {"speaker": "沈文思", "text": "但内需持续性仍待观察", "date": "2026-04-03"}, {"speaker": "沈文思", "text": "3月制造业PMI录得50.4，较2月显著回升1.4个百分点，在春节落在2月的年份中回升幅度略超季节性，结构上产需双双修复", "date": "2026-04-03"}, {"speaker": "沈文思", "text": "内需方面仍存不确定性：新订单、服务业及建筑业虽季节性改善，但持续性有待验证", "date": "2026-04-03"}, {"speaker": "沈文思", "text": "消费指标整体偏弱，预计3月社零同比约2%", "date": "2026-04-03"}, {"speaker": "王本浩", "text": "整体认可经济温和复苏逻辑，3月PMI超季节性上行提供支撑", "date": "2026-04-03"}, {"speaker": "刘曼沁", "text": "当前债市基本面中性偏扰动，资金面宽松但短端利率接近下限", "date": "2026-04-03"}, {"speaker": "刘曼沁", "text": "基本面对债市仍偏中性偏扰动。内需修复尚未证伪", "date": "2026-04-03"}, {"speaker": "杨义山", "text": "基本面韧性犹存但增长路径确定性不强", "date": "2026-04-03"}, {"speaker": "杨义山", "text": "基本面方面，3月PMI略超预期，基本面评分在2-3分区间略向2分靠拢，但增长路径确定性仍不强", "date": "2026-04-03"}, {"speaker": "张晶", "text": "宏观基本面评分维持2分，政策面亦维持2分", "date": "2026-04-10"}, {"speaker": "沈文思", "text": "基本面维持2分评分，一季度数据普遍偏强对债市并不友好", "date": "2026-04-10"}, {"speaker": "沈文思", "text": "整体来看，一季度数据偏强符合预期，基本面对债市并不友好", "date": "2026-04-10"}, {"speaker": "柴颖颖", "text": "债市当前核心矛盾在于对未来经济预期的分歧", "date": "2026-04-10"}, {"speaker": "柴颖颖", "text": "若经济韧性持续验证，尤其是中游制造业韧性好于预期，基本面对债市并不友好", "date": "2026-04-10"}, {"speaker": "赵骥", "text": "GDP不差、出口不差、CPI同比转正，理论上应有政策收敛动作", "date": "2026-04-17"}, {"speaker": "项墩伟", "text": "基本面分从2分上调至3分，Q1数据披露后基本面担忧暂告一段落", "date": "2026-04-17"}, {"speaker": "李博良", "text": "出口数据和通胀情况显示经济基本面并不强劲", "date": "2025-03-10"}, {"speaker": "刘曼沁", "text": "一季度经济表现良好，特别是3月信贷数据强劲", "date": "2025-03-28"}, {"speaker": "刘曼沁", "text": "国内传统高频数据弹性减弱，需寻找新指标评估经济状况", "date": "2025-04-11"}, {"speaker": "研究员-宏观", "text": "当前经济面临通缩压力，核心问题在于通胀预期未能改善且需求端疲软", "date": "2025-04-11"}, {"speaker": "张迪", "text": "一季度GDP及3月份经济数据显示基本面较强", "date": "2025-04-18"}, {"speaker": "赵骥", "text": "目前更应关注出口是否会出现边际下滑", "date": "2025-04-25"}, {"speaker": "杨义山", "text": "五一期间，我们观察到消费数据显著增长，但结构上呈现下沉趋势", "date": "2025-05-05"}, {"speaker": "武玥", "text": "4月数据或呈现出口表观不弱，内需迟迟难增的格局", "date": "2025-05-09"}, {"speaker": "张晶", "text": "当前债市虽仍处于牛市基础之上，但利率已处低位", "date": "2025-06-06"}, {"speaker": "张晶", "text": "团队观点趋于一致看多，但实际操作中因缺乏明确增量信息而维持震荡判断", "date": "2025-06-20"}], "FD_002→FD_007": [{"speaker": "张晶", "text": "即便受地缘冲突影响，价格上涨的持续性在未来两个季度内或难被证伪，PPI内生修复、中游PMI改善及工业企业利润回升等数据所体现的内生性修复", "date": "2026-04-03"}, {"speaker": "沈文思", "text": "国际油价上涨推动原材料购进价格显著提升，3月PPI同比转正及平减指数重回1%以上已基本确认", "date": "2026-04-03"}, {"speaker": "王本浩", "text": "通胀预期与输入性压力构成当前债市核心变量", "date": "2026-04-03"}, {"speaker": "王本浩", "text": "当前债市关键变量在于通胀，伊朗局势虽带来资金面不确定性，但输入性通胀压力难免", "date": "2026-04-03"}, {"speaker": "王本浩", "text": "CPI方面，经济日报发文严厉指控外卖补贴与通缩的关联性，测算显示去年外卖竞争对CPI月度拖累约0.24-0.27个百分点，近期观察外卖补贴已有所减少，若政策有效落地或助推后续通胀上行", "date": "2026-04-03"}, {"speaker": "刘曼沁", "text": "3月季节性回升和油价上行抬升通胀预期，战争若延续还会放大外部不确定性", "date": "2026-04-03"}, {"speaker": "杨义山", "text": "油价因素在发改委限价框架下已消化大半，但向材料成本的传导尚需时间，航运价格已部分反映油价影响", "date": "2026-04-03"}, {"speaker": "李博良", "text": "中期关注霍尔木兹海峡通航及油价走势，即便冲突缓和亦不意味油价快速回落，通胀预期仍存", "date": "2026-04-03"}, {"speaker": "张迪", "text": "虽物价等因素仍存偏利空影响，但更多作为交易层面考量", "date": "2026-04-10"}, {"speaker": "李博良", "text": "中期温和通胀有助于经济底部抬升，存在短期逻辑与中期逻辑的分化", "date": "2026-04-10"}, {"speaker": "刘曼沁", "text": "油价仍是输入性扰动，但若不再极端上冲，对长端的压制有限", "date": "2026-04-10"}, {"speaker": "张晶", "text": "通胀预期和宏观主线的不确定性也值得关注", "date": "2025-06-13"}, {"speaker": "沈文思", "text": "基本面疲弱不支持政策转向，利率上行有上限（1.85%）。央行呵护明确9-10月是买债窗口。短端更确定曲线陡峭化。", "date": "2025-09-12"}], "PL_002→PL_010": [{"speaker": "张晶", "text": "政策端与流动性评估均给予相对中性的3分判断", "date": "2026-04-03"}, {"speaker": "杨义山", "text": "5年以内的资产并未再交易所谓的适度宽松货币政策，国债曲线短端价格已经高于去年12月初水平", "date": "2025-03-10"}, {"speaker": "张晶", "text": "预计3月和4月的经济数据有望环比走高，PMI数据可能维持在51左右", "date": "2025-03-28"}, {"speaker": "杨义山", "text": "明确的是经济下行压力加大，但内需一季度景气环比回升的持续性及抢出口行为的效果尚不明确", "date": "2025-04-11"}, {"speaker": "杨义山", "text": "二季度政策重点在于稳经济，并通过财税和货币政策组合提升企业和居民收入", "date": "2025-04-18"}, {"speaker": "张晶", "text": "对于债券市场而言，宽货币预期仍然是关键", "date": "2025-04-25"}, {"speaker": "刘曼沁", "text": "银行下调存款利率有望打开空间，财政政策配合是关键", "date": "2025-04-25"}, {"speaker": "张晶", "text": "政策空间有限，汇率和利率作为重要工具应审慎使用", "date": "2025-05-05"}, {"speaker": "杨义山", "text": "对五年以内的国债类资产持相对乐观态度，主要受央行恢复国债购买预期的推动", "date": "2025-05-19"}, {"speaker": "张晶", "text": "主要驱动因素包括关税冲击的缓和以及新一轮货币政策边际宽松", "date": "2025-05-23"}, {"speaker": "刘曼沁", "text": "银行下调存款利率有望打开空间，财政政策配合是关键", "date": "2025-05-23"}, {"speaker": "杨义山", "text": "6月份最大的不确定性在于6月18日陆家嘴金融论坛", "date": "2025-06-13"}, {"speaker": "杨义山", "text": "对7月政策预期与经济下行压力的提前交易", "date": "2025-06-20"}], "PL_003→PL_010": [{"speaker": "张晶", "text": "政策端与流动性评估均给予相对中性的3分判断", "date": "2026-04-03"}, {"speaker": "杨义山", "text": "5年以内的资产并未再交易所谓的适度宽松货币政策，国债曲线短端价格已经高于去年12月初水平", "date": "2025-03-10"}, {"speaker": "张晶", "text": "预计3月和4月的经济数据有望环比走高，PMI数据可能维持在51左右", "date": "2025-03-28"}, {"speaker": "杨义山", "text": "明确的是经济下行压力加大，但内需一季度景气环比回升的持续性及抢出口行为的效果尚不明确", "date": "2025-04-11"}, {"speaker": "杨义山", "text": "二季度政策重点在于稳经济，并通过财税和货币政策组合提升企业和居民收入", "date": "2025-04-18"}, {"speaker": "张晶", "text": "对于债券市场而言，宽货币预期仍然是关键", "date": "2025-04-25"}, {"speaker": "刘曼沁", "text": "银行下调存款利率有望打开空间，财政政策配合是关键", "date": "2025-04-25"}, {"speaker": "张晶", "text": "政策空间有限，汇率和利率作为重要工具应审慎使用", "date": "2025-05-05"}, {"speaker": "杨义山", "text": "对五年以内的国债类资产持相对乐观态度，主要受央行恢复国债购买预期的推动", "date": "2025-05-19"}, {"speaker": "张晶", "text": "主要驱动因素包括关税冲击的缓和以及新一轮货币政策边际宽松", "date": "2025-05-23"}, {"speaker": "刘曼沁", "text": "银行下调存款利率有望打开空间，财政政策配合是关键", "date": "2025-05-23"}, {"speaker": "杨义山", "text": "6月份最大的不确定性在于6月18日陆家嘴金融论坛", "date": "2025-06-13"}, {"speaker": "杨义山", "text": "对7月政策预期与经济下行压力的提前交易", "date": "2025-06-20"}], "PL_003→PL_006": [{"speaker": "徐天彤", "text": "一季度货币政策例会表述延续中央经济工作会议和政府工作报告基调，仅增加对外部冲击的关注，央行对此保持观望", "date": "2026-04-03"}, {"speaker": "武玥", "text": "若央行延续当前政策态度，可适度关注长端利差短期压缩及期限利差波段交易机会", "date": "2026-04-03"}, {"speaker": "武玥", "text": "若央行维持当前操作思路，即非实质性收紧货币政策，而是通过稳定宽松预期对冲经济下行压力，则在当前曲线结构下可适度关注长端利差的短期压缩机会", "date": "2026-04-03"}, {"speaker": "刘曼沁", "text": "央行连续两日仅投放5亿逆回购并专门解释，说明其不愿制造流动性收紧预期，但也不希望主要市场利率长期显著低于政策利率", "date": "2026-04-03"}, {"speaker": "杨义山", "text": "央行货政委例会后5亿元小额逆回购投放引发关注，但需结合\"言行一致\"角度审视：例会于3月26日召开，此前一日跨季投放1000亿元，例会未释放季末收紧信号", "date": "2026-04-03"}, {"speaker": "杨义山", "text": "协同重点或更偏向二三季度财政流动性总量安排，而非价格型货币政策转向", "date": "2026-04-03"}, {"speaker": "赵骥", "text": "央行默许了商业银行自发降负债成本、压缩息差的行为，通过FTP机制自动完成调整，自发性宽松意味着债市延续性仍有保障", "date": "2026-04-17"}, {"speaker": "徐天彤", "text": "潘行长继续强调适度宽松货币政策，金融时报再次说明计量投放并非流动性收紧信号", "date": "2026-04-17"}, {"speaker": "王俊华", "text": "社融层面居民贷款仍处于地板附近，这些内需弱势因素能够支撑债券投资者相信央行会从短端持续呵护利率市场", "date": "2026-04-17"}, {"speaker": "姜之媛", "text": "央行定调稳住短端后胜率大幅提升；叠加利差压缩和非银机构久期回补逻辑，加之30-10及10-1利差厚度提供了赔率", "date": "2026-04-17"}, {"speaker": "柴颖颖", "text": "未来市场的关注点主要集中在央行的态度和政策动向上", "date": "2025-03-14"}, {"speaker": "杨义山", "text": "央行的态度是影响这一动态的核心因素之一，最近通过连续三天的大额净投放来稳定市场情绪", "date": "2025-03-21"}, {"speaker": "李博良", "text": "央行态度的边际恢复并不意味着长端利率会显著下行，反而可能会限制利率的下限", "date": "2025-03-21"}, {"speaker": "赵骥", "text": "2015年是一个分水岭。此前以基本面为主导，而2015年后货币政策前置特征明显", "date": "2025-05-05"}, {"speaker": "杨义山", "text": "对五年以内的国债类资产持相对乐观态度", "date": "2025-06-06"}, {"speaker": "柴颖颖", "text": "债市对基本面反应正在钝化，核心矛盾转向央行操作。央行不愿因股市走强导致债市大跌，但若无央行助力10Y难破1.6%。今年行情呈断点化特征，三季度相对友好但四季度争议增大。票息阶段性占优但性价比下降。", "date": "2025-07-18"}, {"speaker": "杨义山", "text": "10Y国债中枢约1.70%，交易下限从1.62%抬升至1.65%-1.70%。基本面环比下行但斜率平缓，政策对冲温和。央行配合发债意图明确。8月区间1.60%-1.80%，需关注反内卷落实、基本面环比幅度、与股市共振三因素。", "date": "2025-08-08"}, {"speaker": "杨义山", "text": "央行买债+偏空退坡→震荡偏多。10-30利差有收敛空间。短端温和宽松。", "date": "2025-10-30"}, {"speaker": "武玥", "text": "买债影响已定价，最大意义封堵利率上限扭转悲观情绪。向下指向需观察操作细节。逆向策略。", "date": "2025-10-30"}], "PL_001→PL_002": [{"speaker": "张晶", "text": "对\"稳增长与防风险\"权衡有无变化，是否释放偏宽松信号还是转向\"经济向好、政策观望\"", "date": "2026-04-17"}, {"speaker": "姜之媛", "text": "如果二季度的目标转向稳经济，则可能对债券市场形成利好或至少是保持一个较为友好的状态", "date": "2025-03-14"}, {"speaker": "杨义山", "text": "二季度中美两国货币政策可能会有一些共振的空间", "date": "2025-03-21"}, {"speaker": "姜之媛", "text": "当前货币政策呈现出一种与市场和经济实体间的僵持状态", "date": "2025-03-28"}, {"speaker": "姜之媛", "text": "短期内利率仍将保持小幅震荡状态", "date": "2025-04-25"}, {"speaker": "赵骥", "text": "5月初时投资策略的摆布比市场观点本身更加关键", "date": "2025-05-09"}, {"speaker": "姜之媛", "text": "短期内利率仍将保持小幅震荡状态", "date": "2025-05-23"}, {"speaker": "杨义山", "text": "五因子分析：公募新规是比美联储更直接的冲击，留有沟通空间。基本面和政策面均中性。关注季末机构行为和央行微操作。", "date": "2025-09-12"}, {"speaker": "杨义山", "text": "四季度货币政策积极但时点晚，10月会议是关键。货币更多配合财政，物价低迷与政策目标平衡是关注重点。", "date": "2025-09-25"}, {"speaker": "杨义山", "text": "基于对政策窗口期财政与货币政策协同的预期，我对12月债市持震荡偏多观点，认为利率在1.85%-1.90%区间具备配置价值。", "date": "2025-11-27"}], "PL_001→PL_010": [{"speaker": "张晶", "text": "政策端与流动性评估均给予相对中性的3分判断", "date": "2026-04-03"}, {"speaker": "杨义山", "text": "5年以内的资产并未再交易所谓的适度宽松货币政策，国债曲线短端价格已经高于去年12月初水平", "date": "2025-03-10"}, {"speaker": "张晶", "text": "预计3月和4月的经济数据有望环比走高，PMI数据可能维持在51左右", "date": "2025-03-28"}, {"speaker": "杨义山", "text": "明确的是经济下行压力加大，但内需一季度景气环比回升的持续性及抢出口行为的效果尚不明确", "date": "2025-04-11"}, {"speaker": "杨义山", "text": "二季度政策重点在于稳经济，并通过财税和货币政策组合提升企业和居民收入", "date": "2025-04-18"}, {"speaker": "张晶", "text": "对于债券市场而言，宽货币预期仍然是关键", "date": "2025-04-25"}, {"speaker": "刘曼沁", "text": "银行下调存款利率有望打开空间，财政政策配合是关键", "date": "2025-04-25"}, {"speaker": "张晶", "text": "政策空间有限，汇率和利率作为重要工具应审慎使用", "date": "2025-05-05"}, {"speaker": "杨义山", "text": "对五年以内的国债类资产持相对乐观态度，主要受央行恢复国债购买预期的推动", "date": "2025-05-19"}, {"speaker": "张晶", "text": "主要驱动因素包括关税冲击的缓和以及新一轮货币政策边际宽松", "date": "2025-05-23"}, {"speaker": "刘曼沁", "text": "银行下调存款利率有望打开空间，财政政策配合是关键", "date": "2025-05-23"}, {"speaker": "杨义山", "text": "6月份最大的不确定性在于6月18日陆家嘴金融论坛", "date": "2025-06-13"}, {"speaker": "杨义山", "text": "对7月政策预期与经济下行压力的提前交易", "date": "2025-06-20"}], "PL_006→PL_005": [{"speaker": "武玥", "text": "央行封顶但下行需降息打开。11月缺乏主线。3-5年利差压缩是唯一机会。", "date": "2025-11-07"}, {"speaker": "杨义山", "text": "央行利率区间管理约束长端。10Y以1.80%中枢±3bp震荡。久期回补但稳定性不足。", "date": "2025-11-07"}, {"speaker": "杨义山", "text": "货币政策报告强化利率区间管理，从总体定价转向精细化管理。等待销售新规落地。", "date": "2025-11-14"}], "PL_002→PL_005": [{"speaker": "武玥", "text": "央行封顶但下行需降息打开。11月缺乏主线。3-5年利差压缩是唯一机会。", "date": "2025-11-07"}, {"speaker": "杨义山", "text": "央行利率区间管理约束长端。10Y以1.80%中枢±3bp震荡。久期回补但稳定性不足。", "date": "2025-11-07"}, {"speaker": "杨义山", "text": "货币政策报告强化利率区间管理，从总体定价转向精细化管理。等待销售新规落地。", "date": "2025-11-14"}], "LQ_002→LQ_001": [{"speaker": "赵骥", "text": "资金宽松主因有二：一是高息定存到期后约90%-95%以短期低息负债形式留存银行体系", "date": "2026-04-03"}, {"speaker": "赵骥", "text": "二是人民币兑美元汇率从7.0升值至6.87附近，结售汇因素对流动性形成隐性补充", "date": "2026-04-03"}, {"speaker": "沈文思", "text": "央行宽松取向未变，经济收紧概率较低，短端资产相对更安全", "date": "2026-04-03"}, {"speaker": "徐天彤", "text": "当前银行体系流动性保持均衡偏松格局，央行公开市场操作更注重价格引导而非数量投放，短端资产确定性较高", "date": "2026-04-03"}, {"speaker": "徐天彤", "text": "加权资金利率降至1.27附近，大型银行融出规模月初已恢复至5万亿水平，符合季度末后季节性回升规律", "date": "2026-04-03"}, {"speaker": "徐天彤", "text": "下周影响资金面因素有限，预计维持均衡或偏松状态", "date": "2026-04-03"}, {"speaker": "项墩伟", "text": "当前债市短端韧性强于长端，资金面稳定偏松构成最大确定性", "date": "2026-04-03"}, {"speaker": "武玥", "text": "短端资金面维持宽松格局，曲线呈现短端极致压缩特征", "date": "2026-04-03"}, {"speaker": "武玥", "text": "市场资金面仍非常宽松，短端资产表现强劲", "date": "2026-04-03"}, {"speaker": "张帆", "text": "短端利率下行超预期但空间有限，强劲配置力量支撑信用债低位运行", "date": "2026-04-03"}, {"speaker": "刘曼沁", "text": "DR001维持在1.27%附近，资金极松，但这更像短期状态而非稳态", "date": "2026-04-03"}, {"speaker": "刘曼沁", "text": "若后续净回笼延续，DR001中枢大概率回到1.30%-1.35%，R007也难持续低于1.45%", "date": "2026-04-03"}, {"speaker": "张迪", "text": "短端资金宽松致交易拥挤但下行空间有限，策略上宜持有不追涨、以活期过渡加杠杆增厚", "date": "2026-04-03"}, {"speaker": "张迪", "text": "当前资金面极度宽松，隔夜利率约1.3%、DR001降至1.2%区间、R001亦处低位，大行融出价格同步下行", "date": "2026-04-03"}, {"speaker": "杨义山", "text": "资金面宽松持续性待观察", "date": "2026-04-03"}, {"speaker": "李博良", "text": "国内资金面方面，3月中旬以来纯债基金申购回升，一季度定价权主要在银行，二季度边际定价权或向基金转移", "date": "2026-04-03"}, {"speaker": "李博良", "text": "4月中旬缴税压力对资金面的扰动需密切观察", "date": "2026-04-03"}, {"speaker": "共识", "text": "资金面虽然易松难紧，但其边际变化至关重要，即将到来的4月税期被视为检验资金面持续性的关键窗口", "date": "2026-04-10"}, {"speaker": "赵骥", "text": "资金链持续宽松时短端和信用票息类资产占优", "date": "2026-04-10"}, {"speaker": "赵骥", "text": "4月税期是验证资金面的重要窗口期", "date": "2026-04-10"}, {"speaker": "赵骥", "text": "资金链易松难紧且为慢变量，一旦出现拐点持续性会比预期更长", "date": "2026-04-10"}, {"speaker": "张晶", "text": "资金面极度宽松仍是当前最坚实支撑", "date": "2026-04-10"}, {"speaker": "徐天彤", "text": "当前资金面维持均衡偏松但价格已处低位，进一步下行空间有限", "date": "2026-04-10"}, {"speaker": "徐天彤", "text": "银行负债端尚无不稳迹象，3月以来偏松格局受益于年初1-2月中长期资金大额投放", "date": "2026-04-10"}, {"speaker": "徐天彤", "text": "4月除4月20日缴税大月外，其他资金面扰动因素较小", "date": "2026-04-10"}, {"speaker": "项墩伟", "text": "鱼尾长度取决于资金宽松持续性和债基理财配置资金持续性", "date": "2026-04-10"}, {"speaker": "张迪", "text": "因活期与资金间存在利差，非银机构减少融出、将资金存放银行，导致银行体系资金充裕，DR007等价格维持低位", "date": "2026-04-10"}, {"speaker": "杨义山", "text": "公开市场操作维持地板量状态预计延续至4月20日税期", "date": "2026-04-10"}, {"speaker": "李博良", "text": "人民币在升值通道中可能伴随流动性流入，短期资金面大幅收敛概率不大", "date": "2026-04-10"}, {"speaker": "沈文思", "text": "央行通过买断式逆回购或地量OMO回笼中长期流动性，但单次规模温和，资金利率仍维持历史低位", "date": "2026-04-17"}, {"speaker": "徐天彤", "text": "当前银行体系流动性处于季节性高位，资金面呈自发性宽松态势", "date": "2026-04-17"}, {"speaker": "项墩伟", "text": "金融时报文章安抚市场及大行负债端指标来看仍处季节性高位，中期流动性维持稳定概率较高", "date": "2026-04-17"}, {"speaker": "武玥", "text": "流动性自发性宽松格局延续，债市阻力最小方向仍是利差压缩", "date": "2026-04-17"}, {"speaker": "武玥", "text": "在央行没有显著收敛资金的情况下，历史上快速上行的可能性较小，更多是维持惯性震荡", "date": "2026-04-17"}, {"speaker": "王俊华", "text": "整体处于偏右侧环境，流动性是债市走强的核心支撑", "date": "2026-04-17"}, {"speaker": "李博良", "text": "资金充裕、资金利率偏低，导致大家等待成本很高，被动式提升久期，各组合久期一直在往上加", "date": "2026-04-17"}, {"speaker": "李博良", "text": "短端利率的确定性相对较高...随着季末临近，场外观望资金可能逐步进场配置", "date": "2025-03-14"}, {"speaker": "张迪", "text": "下周是税期，加上中期借贷便利（MLF）错位的情况，可能会导致大量资金回笼", "date": "2025-04-03"}, {"speaker": "高喆", "text": "自4月中旬以来，央行在资金投放细节上的关注度明显提升", "date": "2025-05-09"}, {"speaker": "张迪", "text": "当前市场已基本完成双向定价，资金宽松逻辑初步交易完毕", "date": "2025-05-19"}, {"speaker": "张迪", "text": "1.7以上的存单仍具备配置价值", "date": "2025-06-06"}, {"speaker": "柴颖颖", "text": "债市整体观点从中性偏多转为中性", "date": "2025-06-26"}, {"speaker": "杨义山", "text": "资金面预计跨季后中性偏松", "date": "2025-06-26"}, {"speaker": "张迪", "text": "存单稳定1.67%-1.68%。四季度资金波动可能上升。降息是短端下行关键。长端不参与。", "date": "2025-09-19"}, {"speaker": "徐天彤", "text": "需关注跨月-5月政府债供给高峰时央行对冲力度", "date": "2026-04-24"}, {"speaker": "张迪", "text": "央行回笼5000亿，关注资金面及短端边际变化", "date": "2026-04-30"}], "LQ_002→LQ_005": [{"speaker": "徐天彤", "text": "需重点关注下周大税期来临及税后跨月压力，以及隔夜利率长期偏低背景下央行引导价格小幅回升的可能性", "date": "2026-04-17"}, {"speaker": "张迪", "text": "仍看好长端，短端亦有一定支撑；\"活期利率1.4%\"约束正在松动", "date": "2026-04-17"}, {"speaker": "张迪", "text": "一旦下调之后，短端资产的定价锚将再次下移，形成一轮新的短端下行驱动", "date": "2026-04-17"}, {"speaker": "杨义山", "text": "银行自律行为导致的自发性宽松（本周陆续有银行在结息周期内临时下调活期存款利率），整个债市仍有一定支撑", "date": "2026-04-17"}, {"speaker": "李博良", "text": "若活期存款大面积下调，短端锚将再次下移，可能形成\"左脚踩右脚\"的自我强化式下行", "date": "2026-04-17"}, {"speaker": "张迪", "text": "后续资金预计不会进一步下行，1.6%以下的存单性价比不高。从季节性、央行回笼、政府债供给、套利空间四方面论证资金进一步下行概率低。存单从绝对点位和比价角度均不具优势，操作上建议观望。", "date": "2025-07-04"}, {"speaker": "张迪", "text": "长端受权益主导操作难度高。央行操作矛盾但配合发债意图明确。8月存单季节性上行规律需警惕，避开8月中下旬。信用利差极端水平下削减信用债配置，转向存单及存款品种。重点提示建行可能重启高息定期存款机会。", "date": "2025-07-18"}, {"speaker": "张迪", "text": "资金极度宽松引发套利循环，银行降活期利率促使资金转向现金管理理财。央行呵护意愿强烈但波动可能加大。短期资金利率突破至1.66%，预计低波窄幅震荡持续。长端下行空间小需等待催化剂。", "date": "2025-08-08"}, {"speaker": "孔祥雨", "text": "资金面净回笼但短端信用仍有40-50bp利差。资本利得有限，多头抱团已瓦解，利率债偏空。银行提价发存单预示价格可能上行。计划8月下旬至9月逐步布局。", "date": "2025-08-15"}], "LQ_001→LQ_005": [{"speaker": "徐天彤", "text": "需重点关注下周大税期来临及税后跨月压力，以及隔夜利率长期偏低背景下央行引导价格小幅回升的可能性", "date": "2026-04-17"}, {"speaker": "张迪", "text": "仍看好长端，短端亦有一定支撑；\"活期利率1.4%\"约束正在松动", "date": "2026-04-17"}, {"speaker": "张迪", "text": "一旦下调之后，短端资产的定价锚将再次下移，形成一轮新的短端下行驱动", "date": "2026-04-17"}, {"speaker": "杨义山", "text": "银行自律行为导致的自发性宽松（本周陆续有银行在结息周期内临时下调活期存款利率），整个债市仍有一定支撑", "date": "2026-04-17"}, {"speaker": "李博良", "text": "若活期存款大面积下调，短端锚将再次下移，可能形成\"左脚踩右脚\"的自我强化式下行", "date": "2026-04-17"}, {"speaker": "张迪", "text": "后续资金预计不会进一步下行，1.6%以下的存单性价比不高。从季节性、央行回笼、政府债供给、套利空间四方面论证资金进一步下行概率低。存单从绝对点位和比价角度均不具优势，操作上建议观望。", "date": "2025-07-04"}, {"speaker": "张迪", "text": "长端受权益主导操作难度高。央行操作矛盾但配合发债意图明确。8月存单季节性上行规律需警惕，避开8月中下旬。信用利差极端水平下削减信用债配置，转向存单及存款品种。重点提示建行可能重启高息定期存款机会。", "date": "2025-07-18"}, {"speaker": "张迪", "text": "资金极度宽松引发套利循环，银行降活期利率促使资金转向现金管理理财。央行呵护意愿强烈但波动可能加大。短期资金利率突破至1.66%，预计低波窄幅震荡持续。长端下行空间小需等待催化剂。", "date": "2025-08-08"}, {"speaker": "孔祥雨", "text": "资金面净回笼但短端信用仍有40-50bp利差。资本利得有限，多头抱团已瓦解，利率债偏空。银行提价发存单预示价格可能上行。计划8月下旬至9月逐步布局。", "date": "2025-08-15"}], "LQ_004→LQ_003": [{"speaker": "张帆", "text": "短端方面，存单利率近期下行幅度超预期（今日再降3BP），资金利率处于极低水平", "date": "2026-04-03"}, {"speaker": "李博良", "text": "存单价格下破1.5%至历史低位超预期，3月央行回笼操作下资金面仍保持平稳", "date": "2026-04-03"}, {"speaker": "张迪", "text": "本周评分边际变化在于存单评分从三分下调至两分", "date": "2026-04-10"}, {"speaker": "徐天彤", "text": "存单利率延续3月以来下行趋势，3月以来已连续下行达11BP", "date": "2026-04-17"}, {"speaker": "张帆", "text": "在存单基础上适度上移久期，2～3年国开债自调整以来已下行4～5BP，票息与久期拉升效果显著", "date": "2026-04-17"}, {"speaker": "张迪", "text": "短端政金债作为现金替代券种，其定价主要参考OMO利率，在当前环境下已基本合理", "date": "2025-05-09"}, {"speaker": "张迪", "text": "下周是观察资金面和存单走势的一个关键窗口", "date": "2025-06-06"}, {"speaker": "张迪", "text": "短端低波延续，降息概率低。1.68%存单适合套息配置但资本利得难。", "date": "2025-10-17"}], "LQ_003→LQ_005": [{"speaker": "徐天彤", "text": "需重点关注下周大税期来临及税后跨月压力，以及隔夜利率长期偏低背景下央行引导价格小幅回升的可能性", "date": "2026-04-17"}, {"speaker": "张迪", "text": "仍看好长端，短端亦有一定支撑；\"活期利率1.4%\"约束正在松动", "date": "2026-04-17"}, {"speaker": "张迪", "text": "一旦下调之后，短端资产的定价锚将再次下移，形成一轮新的短端下行驱动", "date": "2026-04-17"}, {"speaker": "杨义山", "text": "银行自律行为导致的自发性宽松（本周陆续有银行在结息周期内临时下调活期存款利率），整个债市仍有一定支撑", "date": "2026-04-17"}, {"speaker": "李博良", "text": "若活期存款大面积下调，短端锚将再次下移，可能形成\"左脚踩右脚\"的自我强化式下行", "date": "2026-04-17"}, {"speaker": "张迪", "text": "后续资金预计不会进一步下行，1.6%以下的存单性价比不高。从季节性、央行回笼、政府债供给、套利空间四方面论证资金进一步下行概率低。存单从绝对点位和比价角度均不具优势，操作上建议观望。", "date": "2025-07-04"}, {"speaker": "张迪", "text": "长端受权益主导操作难度高。央行操作矛盾但配合发债意图明确。8月存单季节性上行规律需警惕，避开8月中下旬。信用利差极端水平下削减信用债配置，转向存单及存款品种。重点提示建行可能重启高息定期存款机会。", "date": "2025-07-18"}, {"speaker": "张迪", "text": "资金极度宽松引发套利循环，银行降活期利率促使资金转向现金管理理财。央行呵护意愿强烈但波动可能加大。短期资金利率突破至1.66%，预计低波窄幅震荡持续。长端下行空间小需等待催化剂。", "date": "2025-08-08"}, {"speaker": "孔祥雨", "text": "资金面净回笼但短端信用仍有40-50bp利差。资本利得有限，多头抱团已瓦解，利率债偏空。银行提价发存单预示价格可能上行。计划8月下旬至9月逐步布局。", "date": "2025-08-15"}, {"speaker": "张帆", "text": "存单利率持续维持在低位，下行空间有限", "date": "2026-04-24"}], "LQ_002→LQ_003": [{"speaker": "张帆", "text": "短端方面，存单利率近期下行幅度超预期（今日再降3BP），资金利率处于极低水平", "date": "2026-04-03"}, {"speaker": "李博良", "text": "存单价格下破1.5%至历史低位超预期，3月央行回笼操作下资金面仍保持平稳", "date": "2026-04-03"}, {"speaker": "张迪", "text": "本周评分边际变化在于存单评分从三分下调至两分", "date": "2026-04-10"}, {"speaker": "徐天彤", "text": "存单利率延续3月以来下行趋势，3月以来已连续下行达11BP", "date": "2026-04-17"}, {"speaker": "张帆", "text": "在存单基础上适度上移久期，2～3年国开债自调整以来已下行4～5BP，票息与久期拉升效果显著", "date": "2026-04-17"}, {"speaker": "张迪", "text": "短端政金债作为现金替代券种，其定价主要参考OMO利率，在当前环境下已基本合理", "date": "2025-05-09"}, {"speaker": "张迪", "text": "下周是观察资金面和存单走势的一个关键窗口", "date": "2025-06-06"}, {"speaker": "张迪", "text": "短端低波延续，降息概率低。1.68%存单适合套息配置但资本利得难。", "date": "2025-10-17"}], "MS_001→MS_004": [{"speaker": "高喆", "text": "短端动量因子38分略偏多，期货基差因子由前周略偏高转为略偏低", "date": "2026-04-10"}, {"speaker": "高喆", "text": "伴随中短持续下行，长端绝对点位相比短端信用债较高，尤其是地方债", "date": "2026-04-10"}, {"speaker": "姜之媛", "text": "长端10年国债若触及1.85%可小仓位博弈", "date": "2026-04-10"}, {"speaker": "姜之媛", "text": "若资金继续宽松可做多中短端博波段，若长端因外部因素调整（如10年国债触及1.85%）可小仓位博弈", "date": "2026-04-10"}, {"speaker": "刘曼沁", "text": "曲线极度陡峭后，资金有望从1Y附近逐步转向10Y国开等中长端利差品种", "date": "2026-04-10"}, {"speaker": "武玥", "text": "在应对供给扰动期间，市场未出现明显回调，说明情绪仍偏强，应遵循纪律保有长端仓位", "date": "2026-04-17"}, {"speaker": "姜之媛", "text": "基金在中长债券上的敞口暴露已回到两位数、但距极值最高位仍有一定距离，30年或还有一些空间", "date": "2026-04-17"}, {"speaker": "张帆", "text": "一直看好10年国开，目前所有账户的10年国开比例均已达到10%以上", "date": "2026-04-17"}, {"speaker": "孔祥雨", "text": "30年国债、10年国开、15～20年地方债本质上都是对当前曲线陡峭度的修正，均可适量配置", "date": "2026-04-17"}, {"speaker": "李博良", "text": "市场走势略超预期，短期资金宽松支撑不变，等待成本过高导致被动式拉久期", "date": "2026-04-17"}, {"speaker": "孔祥雨", "text": "今年市场的复杂性和多变性使得依赖去年的趋势交易策略变得困难", "date": "2025-04-11"}], "MS_001→MS_006": [{"speaker": "张帆", "text": "中等期限信用债仍有支撑", "date": "2026-04-10"}, {"speaker": "武玥", "text": "中长期票息策略仍是当前最优方向，中短品种目前不受资金面制约", "date": "2026-04-17"}, {"speaker": "武玥", "text": "二永供给冲击更可能以利差被动走阔、相对滞涨的方式消化，真实冲击有限", "date": "2026-04-17"}, {"speaker": "柴颖颖", "text": "长期来看，信用债仍有一定的配置需求", "date": "2025-04-03"}, {"speaker": "孔祥雨", "text": "更倾向于重视信用债的票息价值，而非继续期待信用利差收窄", "date": "2025-04-25"}], "MS_001→MS_003": [{"speaker": "共识", "text": "全球资产进入\"贝叶斯定价\"模式，波动率攀升，传统分析框架面临挑战", "date": "2026-04-03"}, {"speaker": "柴颖颖", "text": "内需修复节奏不畅、避险情绪升温及股市波动等因素导致部分资金拥挤于短债、货基等短期限品种，推高期限利差", "date": "2026-04-03"}, {"speaker": "高喆", "text": "短端动量因子处于震荡区间，短端需求虽仍旺盛但当前点位保护已不充足", "date": "2026-04-03"}, {"speaker": "张迪", "text": "导致短端交易较为拥挤", "date": "2026-04-03"}, {"speaker": "项墩伟", "text": "30-10利差空间不算窄，但是市场担忧目前30Y的活跃券都有可能被抛弃，实操择券难度大", "date": "2026-04-10"}, {"speaker": "高喆", "text": "中短债理财的需求旺盛，但进一步压缩的空间不足", "date": "2026-04-10"}, {"speaker": "李博良", "text": "5年二永下行较多后超额收益已不显著，市场正从5年高等级向中等级信用资质延伸", "date": "2026-04-10"}, {"speaker": "姜之媛", "text": "中短端性价比极低、套息拥挤", "date": "2026-04-10"}, {"speaker": "孔祥雨", "text": "中端因拥挤度面临压力", "date": "2026-04-10"}, {"speaker": "孔祥雨", "text": "中端（1-5年）因持仓集中、下注最多而面临拥挤度压力，交易机会转瞬即逝且难以抓取", "date": "2026-04-10"}, {"speaker": "孔祥雨", "text": "本轮二永债行情从八九十分位全面介入，现已下行至30分位...当前已进入鱼尾行情，未配置者不宜再追", "date": "2026-04-10"}, {"speaker": "刘曼沁", "text": "纯债基申购旺盛，短端交易较拥挤", "date": "2026-04-10"}, {"speaker": "武玥", "text": "利差压缩后各品类价值均处低位，市场到去α保留β阶段。有胜率没赔率，交易盘抢跑后止盈压力需关注。维持区间1.6%-1.65%判断，信用二永考虑哑铃策略。", "date": "2025-07-04"}, {"speaker": "姜之媛", "text": "今天市场非理性下跌由未经证实的消息引发黑色系暴涨所致。市场情绪过度聚焦政治局会议预期。固收+底层逻辑未动摇，但若有效需求刺激超预期将果断降久期。ETF大额净流入提供缓冲，但需警惕场内ETF被当作提款机。", "date": "2025-07-29"}, {"speaker": "柴颖颖", "text": "跌幅已基本到位但反弹空间受权益压制。终局思维在债市表现远不及股商。当前行情与2023年初类似。若商品验证需求回升则调整加剧。根据产品特性适度减仓控制风险暴露。", "date": "2025-07-29"}, {"speaker": "武玥", "text": "市场延续上周逻辑但波动性显著加剧。机构分化：匀速卖出vs集中处理高税负品种。技术面关键位突破可能引发整体震荡。加仓时机需结合政策预期与资金面动态。", "date": "2025-07-29"}, {"speaker": "李博良", "text": "市场脆弱平衡情绪过度反应，修复不可持续。利率反复震荡需等待通胀叙事验证。采取高频波段策略：高位加仓配合止盈。资产配置向高等级倾斜以规避零售端资金异动。", "date": "2025-07-29"}], "MS_003→MS_005": [{"speaker": "共识", "text": "市场已度过赔率最丰厚的阶段，预计将维持震荡，业绩分化可能持续", "date": "2026-04-10"}, {"speaker": "张迪", "text": "长端观点维持与上周一致，态度并不悲观...曲线陡峭化行情已略有扭转、稍走平坦，主因短端利率过低，长端性价比相对突出", "date": "2026-04-10"}, {"speaker": "武玥", "text": "长端赔率相对更有吸引力但需等待催化剂", "date": "2026-04-10"}, {"speaker": "武玥", "text": "长端维持不悲观判断，从陡峭稍微有所扭转走平了一点，长端性价比相对更有吸引力", "date": "2026-04-10"}, {"speaker": "武玥", "text": "长端赔率此前处于极高位置（对应99%分位），目前边际下降至97%-96%分位附近", "date": "2026-04-10"}, {"speaker": "柴颖颖", "text": "资金宽松提供底部支撑但赔率最丰厚阶段已过，建议保持谨慎", "date": "2026-04-10"}, {"speaker": "张帆", "text": "短端和存单价格已极度极限", "date": "2026-04-10"}, {"speaker": "孔祥雨", "text": "短端则因资金价格已处边际鸡肋水平而面临压力。因此，本周将存单打分调整为两分", "date": "2026-04-10"}, {"speaker": "孔祥雨", "text": "相较于1.8%出头的国债、1.9%出头的国开及波动剧烈的30年超长期国债，地方债恰为压舱长端的相对良好的工具", "date": "2026-04-10"}, {"speaker": "共识", "text": "当前处于\"高胜率、低赔率\"的象限，资金宽松的格局短期难以逆转，市场下行风险有限", "date": "2026-04-17"}, {"speaker": "赵骥", "text": "债市当前处于高胜率、低赔率象限——收益率大幅下行的赔率已很有限，但资金宽松主线短期不会逆转", "date": "2026-04-17"}, {"speaker": "李博良", "text": "在当前位置建议先观望，特别是关注下周存单能否企稳", "date": "2025-03-10"}, {"speaker": "武玥", "text": "整体而言，长端利率的胜率较低，而中短端具有一定的配置价值", "date": "2025-03-10"}, {"speaker": "武玥", "text": "建议倾向于持有能够算得过账的品种，例如下沉一些的两年期信用债", "date": "2025-03-10"}, {"speaker": "武玥", "text": "倾向于采取相对保守的态度，并建议在信用品种中寻找机会", "date": "2025-03-14"}, {"speaker": "武玥", "text": "当前有一个边际变化，即开始寻找长端的买点", "date": "2025-03-21"}, {"speaker": "武玥", "text": "在3月份保持谨慎态度的基础上，4月份应寻找合适的买入点", "date": "2025-03-28"}, {"speaker": "张帆", "text": "对于二季度债券利率市场的看法是不宜过度看空，预计整体市场将呈现震荡态势", "date": "2025-03-28"}, {"speaker": "姜之媛", "text": "市场预期处于一个较为中间的状态，并非极度悲观也未过度乐观", "date": "2025-04-03"}, {"speaker": "张帆", "text": "4月上旬可能是较好的做多窗口", "date": "2025-04-03"}, {"speaker": "武玥", "text": "债市已迅速反映了这些情绪冲击。二季度可能的降准措施预计会缓解流动性压力", "date": "2025-04-11"}, {"speaker": "李博良", "text": "短期内市场方向不明，政策性因素可能成为关键变量", "date": "2025-04-18"}, {"speaker": "武玥", "text": "策略上建议适度杠杆，围绕中位数久期进行波段操作", "date": "2025-04-18"}, {"speaker": "张帆", "text": "1-3年期信用债具有较高配置价值，正套空间约为30-40bp，建议加大配置力度", "date": "2025-04-18"}, {"speaker": "柴颖颖", "text": "当前市场处于一个相对中性的位置", "date": "2025-04-18"}, {"speaker": "姜之媛", "text": "不建议过度拉长久期，需保持波段操作思路", "date": "2025-04-18"}, {"speaker": "武玥", "text": "当前的投资策略应该是积累小胜为大胜", "date": "2025-04-25"}, {"speaker": "张帆", "text": "整体债券市场将继续维持震荡走势", "date": "2025-04-25"}, {"speaker": "武玥", "text": "整体上行风险不大，曲线可能先陡后平，信用继续补充票息资产", "date": "2025-05-09"}, {"speaker": "姜之媛", "text": "牛市基础尚存，但短期内受制于宽幅震荡格局，交易难度有所上升", "date": "2025-05-09"}, {"speaker": "张帆", "text": "当前对债券资产的看法进行了适度调整，总体上认同后续利率下行过程可能不会一蹴而就", "date": "2025-05-09"}, {"speaker": "李博良", "text": "当前市场可能处于震荡略偏多的状态，收益率曲线预计将经历先陡峭后平坦的过程", "date": "2025-05-09"}, {"speaker": "李博良", "text": "预期利率在1.65-1.70之间波动", "date": "2025-05-19"}, {"speaker": "姜之媛", "text": "市场进入调仓和观望阶段", "date": "2025-05-19"}, {"speaker": "张帆", "text": "关注1.8以上点位配置价值", "date": "2025-05-19"}, {"speaker": "柴颖颖", "text": "当前阶段对配置盘相对友好，但对交易盘而言操作难度较大", "date": "2025-05-19"}, {"speaker": "孔祥雨", "text": "当前整体宽松趋势已进入尾声，利率水平上下空间均有限", "date": "2025-05-19"}, {"speaker": "武玥", "text": "当前的投资策略应该是积累小胜为大胜", "date": "2025-05-23"}, {"speaker": "张帆", "text": "整体债券市场将继续维持震荡走势", "date": "2025-05-23"}, {"speaker": "武玥", "text": "6月调整或提供加仓机会", "date": "2025-05-30"}, {"speaker": "张帆", "text": "关注1.8以上点位配置价值", "date": "2025-05-30"}, {"speaker": "李博良", "text": "信用债短端利差压缩殆尽，配置价值有限", "date": "2025-05-30"}, {"speaker": "武玥", "text": "6月利率品种或将优于信用品种", "date": "2025-06-06"}, {"speaker": "柴颖颖", "text": "整体策略仍以稳健为主", "date": "2025-06-06"}, {"speaker": "张帆", "text": "1-3年期信用债具有较高配置价值", "date": "2025-06-06"}, {"speaker": "张帆", "text": "利率下行方向依然明确", "date": "2025-06-13"}, {"speaker": "李博良", "text": "建议在定价合理位置择机退出超长端持仓", "date": "2025-06-20"}, {"speaker": "张帆", "text": "预计7月初为半年度自发性宽松周期的终点", "date": "2025-06-20"}, {"speaker": "李博良", "text": "10Y国债1.70%中性偏鸡肋。8月上旬顺风窗口但利率下行不及预期，窗口可能关闭。核心矛盾是长端赔率不足。以赔率为导向波段操作：低时降久期，赔率打开再加仓。", "date": "2025-08-08"}, {"speaker": "武玥", "text": "维持1.8关键点位判断。看似脱敏实为节奏博弈。1.85可直接博弈，1.85-1.9需边走边看。93阅兵为节奏关键节点。仓位不宜过重需快速反应。", "date": "2025-08-28"}, {"speaker": "蒋苑", "text": "从偏低仓位调至中性略偏多。久期极低提供加仓空间。费率新规冲击有限。", "date": "2025-10-30"}, {"speaker": "谢秋平", "text": "长端交易拥挤度高，30-10利差压缩临近43bp，博收益概率下降", "date": "2026-04-24"}], "MS_014→MS_001": [{"speaker": "共识", "text": "当前市场处于 \"多空激烈博弈\" 的拉锯状态，分歧显著", "date": "2026-04-03"}, {"speaker": "共识", "text": "地缘政治（美伊冲突）、输入性通胀（油价）和国内经济内需的持续性，共同构成了市场的主要不确定性来源", "date": "2026-04-03"}, {"speaker": "赵骥", "text": "本周多空观点分歧较前两周明显扩大", "date": "2026-04-03"}, {"speaker": "张晶", "text": "当前全球资产已进入\"贝叶斯定价模式\"，即依据高频涌现的新信息以日度频度动态修正资产价格，导致各类资产波动率大幅攀升、相关性紊乱", "date": "2026-04-03"}, {"speaker": "徐天彤", "text": "长端债券受通胀预期、供给压力及地缘政治等多重因素扰动，趋势性机会有限", "date": "2026-04-03"}, {"speaker": "项墩伟", "text": "目前债市存在较大的分歧，对于地缘因素持续时间及影响，输入性通胀的影响市场存在不同的解读", "date": "2026-04-03"}, {"speaker": "柴颖颖", "text": "当前债市处于多空激烈博弈的拉锯状态，短期不确定性仍存", "date": "2026-04-03"}, {"speaker": "柴颖颖", "text": "目前债市整体预期仍偏乐观", "date": "2026-04-03"}, {"speaker": "姜之媛", "text": "债市短期维持窄幅震荡格局，多空力量拉锯下适合以票息策略为主", "date": "2026-04-03"}, {"speaker": "姜之媛", "text": "债券近期走势超预期偏强，10年期国债全周窄幅震荡约2BP", "date": "2026-04-03"}, {"speaker": "姜之媛", "text": "一是衰退交易预期边际升温，收益率曲线陡峭化（30-10、10-1均走阔）赋予资金压缩利差的动力", "date": "2026-04-03"}, {"speaker": "姜之媛", "text": "二是A股及全球Risk off环境下机构资金流入债市体现避险需求", "date": "2026-04-03"}, {"speaker": "姜之媛", "text": "当前多空力量相互牵制，市场分歧显著（卖方路演观点一多一空）", "date": "2026-04-03"}, {"speaker": "姜之媛", "text": "衰退可能逐步显现，债券或相对权益与商品先行见底，后续需逐步跟踪资产边际变化并调整配置思路", "date": "2026-04-03"}, {"speaker": "高喆", "text": "本周债券曲线绝对水平及陡峭程度预计均呈震荡格局，策略上维持中性观点", "date": "2026-04-03"}, {"speaker": "高喆", "text": "长端点位偏高但基本面与供给预期制约其表现，曲线或从走陡逐步转向走平", "date": "2026-04-03"}, {"speaker": "高喆", "text": "上周策略观点预测曲线绝对水平震荡、陡峭程度略微看陡，实际运行结果基本验证判断：5年期二永债收益率下行0.4BP，30-5年期利差走阔2.7BP", "date": "2026-04-03"}, {"speaker": "高喆", "text": "本周观点维持与上周持平，曲线绝对水平及陡峭程度预计均呈震荡态势", "date": "2026-04-03"}, {"speaker": "刘曼沁", "text": "市场对流动性宽松已有一致预期，短端交易情绪强于长端", "date": "2026-04-03"}, {"speaker": "杨义山", "text": "市场情绪谨慎略空", "date": "2026-04-03"}, {"speaker": "杨义山", "text": "利率整体维持中性评分", "date": "2026-04-03"}, {"speaker": "杨义山", "text": "公募产品跟踪显示，两会以来景气中枢从3.9略降至3.7，但久期分歧度快速压缩至2年以内水平，反映市场处于谨慎略空状态", "date": "2026-04-03"}, {"speaker": "李博良", "text": "地缘政治方面，中东局势存在两条逻辑：短线关注冲突是否结束，市场已对特朗普讲话边际脱敏，黄金等避险资产敏感度下降", "date": "2026-04-03"}, {"speaker": "共识", "text": "驱动市场的主线正在发生变化：早期由地缘政治冲突等因素主导的定价逻辑逐步淡化，国内资金面的宽松程度已成为当前市场的核心支撑和主要观察维度", "date": "2026-04-10"}, {"speaker": "赵骥", "text": "地缘冲突若再度升级，长端超长端有交易性机会", "date": "2026-04-10"}, {"speaker": "赵骥", "text": "地缘风险对各类资产的影响已逐步钝化，回归国内自身逻辑", "date": "2026-04-10"}, {"speaker": "张晶", "text": "短期内多空因素博弈中情绪面或占据首要位置", "date": "2026-04-10"}, {"speaker": "高喆", "text": "市场对长端情绪已告别谨慎状态，对冲成本降低", "date": "2026-04-10"}, {"speaker": "高喆", "text": "期货基差因子-0.003元，从略偏高位置转向略偏低位置。显示市场对长端告别谨慎情绪，对冲成本转低", "date": "2026-04-10"}, {"speaker": "杨义山", "text": "短期内债市定价或主要受外部情绪传导及长端换券因素影响", "date": "2026-04-10"}, {"speaker": "杨义山", "text": "后续曲线走向取决于税期前后资金面修正幅度及外部市场情绪传导", "date": "2026-04-10"}, {"speaker": "李博良", "text": "市场情绪相对偏平", "date": "2026-04-10"}, {"speaker": "李博良", "text": "市场对美伊冲突的再钝化趋势明显...短期对通胀交易趋于钝化", "date": "2026-04-10"}, {"speaker": "张帆", "text": "当前市场分歧较大，外部冲突的不确定性对交易有扰动，但后续影响或趋于自动化", "date": "2026-04-10"}, {"speaker": "孔祥雨", "text": "美伊冲突对债市最尖锐影响已过，当前债市情绪与机构行为主导市场定价", "date": "2026-04-10"}, {"speaker": "孔祥雨", "text": "美伊冲突作为前期交易热点，其对国内债市最尖锐的影响时段已过，后续更多是通过股债跷跷板、机构行为及资本流向等形式渐进式、反复递进地淡化", "date": "2026-04-10"}, {"speaker": "刘曼沁", "text": "当前情绪正从追逐短端，切向等待曲线趋平和长端性价比修复", "date": "2026-04-10"}, {"speaker": "李博良", "text": "市场更倾向于震荡偏多，但从当前观察来看，操作时机并不理想", "date": "2025-04-25"}, {"speaker": "李博良", "text": "市场更倾向于震荡偏多，但从当前观察来看，操作时机并不理想", "date": "2025-05-23"}, {"speaker": "张晶", "text": "季末、半年末银行因考核压力可能引发的操作扰动", "date": "2025-06-13"}, {"speaker": "刘曼沁", "text": "10Y前低约在1.65，目前仍未突破", "date": "2025-06-13"}, {"speaker": "武玥", "text": "反映出市场对三季度经济触底和政策转向的强预期", "date": "2025-06-20"}, {"speaker": "武玥", "text": "当前处于存量博弈阶段，操作难度极大。久期高位结构脆弱，技术性操作易失效。应降低操作精度要求，避免盲目止损或追高，等待央行宽松兑现。坚守债市底气来自中美博弈与稳就业对宽松货币环境的需要。", "date": "2025-07-18"}, {"speaker": "姜之媛", "text": "债市最缺乏内生稳定性，走势完全依赖权益市场。超长债交易面临多重困境：换券频繁、期现背离、行情碎片化。基于五因子模型评估，基本面利多已被充分定价，风险偏好成核心风险点。需警惕居民理财行为变化，放弃股债双牛预期转向票息策略控制久期。", "date": "2025-07-18"}, {"speaker": "张帆", "text": "债市进入高难度交易阶段，权益更占优。理财规模仅增2000亿反映固收吸引力下降。存单交易空间持续收窄。以中性久期+票息策略为主严守安全边际。", "date": "2025-08-08"}, {"speaker": "张帆", "text": "大类资产轮动处于极致位置。股市风偏顶峰+债市临近脱敏。股债两侧均面临左侧考验，短期债市可能存在下行修复机会。", "date": "2025-08-15"}, {"speaker": "杨义山", "text": "核心驱动已从基本面转向市场预期变化。股市好Beta挤压债市坏Beta。脆弱性来源：情绪冲击+PPI向CPI传导。债市最大支撑仍是央行资金面操作。后续锯齿状波动需警惕事件催化。", "date": "2025-08-15"}, {"speaker": "汪磊", "text": "费率调整冲击负债端，四季度需注重负债端管理。权益参照2014年底走势维持上行判断。转债波动更大但方向与权益一致。", "date": "2025-09-12"}, {"speaker": "孔祥雨", "text": "股市看上攻4000点，债市有安全边际但不急于增配。操作仅限波段交易，警惕倒车卖人风险。四季度等更好时机。", "date": "2025-09-12"}, {"speaker": "武玥", "text": "股市有政策顶3800-3900，债市上有顶下有底。短期受股债联动，中期回归基本面。", "date": "2025-09-19"}, {"speaker": "姜之媛", "text": "观点从谨慎调至中性，贸易战带来边际改善。短期仍谨慎，短信用债套息有效。", "date": "2025-10-17"}], "MS_008→MS_001": [{"speaker": "共识", "text": "当前市场处于 \"多空激烈博弈\" 的拉锯状态，分歧显著", "date": "2026-04-03"}, {"speaker": "共识", "text": "地缘政治（美伊冲突）、输入性通胀（油价）和国内经济内需的持续性，共同构成了市场的主要不确定性来源", "date": "2026-04-03"}, {"speaker": "赵骥", "text": "本周多空观点分歧较前两周明显扩大", "date": "2026-04-03"}, {"speaker": "张晶", "text": "当前全球资产已进入\"贝叶斯定价模式\"，即依据高频涌现的新信息以日度频度动态修正资产价格，导致各类资产波动率大幅攀升、相关性紊乱", "date": "2026-04-03"}, {"speaker": "徐天彤", "text": "长端债券受通胀预期、供给压力及地缘政治等多重因素扰动，趋势性机会有限", "date": "2026-04-03"}, {"speaker": "项墩伟", "text": "目前债市存在较大的分歧，对于地缘因素持续时间及影响，输入性通胀的影响市场存在不同的解读", "date": "2026-04-03"}, {"speaker": "柴颖颖", "text": "当前债市处于多空激烈博弈的拉锯状态，短期不确定性仍存", "date": "2026-04-03"}, {"speaker": "柴颖颖", "text": "目前债市整体预期仍偏乐观", "date": "2026-04-03"}, {"speaker": "姜之媛", "text": "债市短期维持窄幅震荡格局，多空力量拉锯下适合以票息策略为主", "date": "2026-04-03"}, {"speaker": "姜之媛", "text": "债券近期走势超预期偏强，10年期国债全周窄幅震荡约2BP", "date": "2026-04-03"}, {"speaker": "姜之媛", "text": "一是衰退交易预期边际升温，收益率曲线陡峭化（30-10、10-1均走阔）赋予资金压缩利差的动力", "date": "2026-04-03"}, {"speaker": "姜之媛", "text": "二是A股及全球Risk off环境下机构资金流入债市体现避险需求", "date": "2026-04-03"}, {"speaker": "姜之媛", "text": "当前多空力量相互牵制，市场分歧显著（卖方路演观点一多一空）", "date": "2026-04-03"}, {"speaker": "姜之媛", "text": "衰退可能逐步显现，债券或相对权益与商品先行见底，后续需逐步跟踪资产边际变化并调整配置思路", "date": "2026-04-03"}, {"speaker": "高喆", "text": "本周债券曲线绝对水平及陡峭程度预计均呈震荡格局，策略上维持中性观点", "date": "2026-04-03"}, {"speaker": "高喆", "text": "长端点位偏高但基本面与供给预期制约其表现，曲线或从走陡逐步转向走平", "date": "2026-04-03"}, {"speaker": "高喆", "text": "上周策略观点预测曲线绝对水平震荡、陡峭程度略微看陡，实际运行结果基本验证判断：5年期二永债收益率下行0.4BP，30-5年期利差走阔2.7BP", "date": "2026-04-03"}, {"speaker": "高喆", "text": "本周观点维持与上周持平，曲线绝对水平及陡峭程度预计均呈震荡态势", "date": "2026-04-03"}, {"speaker": "刘曼沁", "text": "市场对流动性宽松已有一致预期，短端交易情绪强于长端", "date": "2026-04-03"}, {"speaker": "杨义山", "text": "市场情绪谨慎略空", "date": "2026-04-03"}, {"speaker": "杨义山", "text": "利率整体维持中性评分", "date": "2026-04-03"}, {"speaker": "杨义山", "text": "公募产品跟踪显示，两会以来景气中枢从3.9略降至3.7，但久期分歧度快速压缩至2年以内水平，反映市场处于谨慎略空状态", "date": "2026-04-03"}, {"speaker": "李博良", "text": "地缘政治方面，中东局势存在两条逻辑：短线关注冲突是否结束，市场已对特朗普讲话边际脱敏，黄金等避险资产敏感度下降", "date": "2026-04-03"}, {"speaker": "共识", "text": "驱动市场的主线正在发生变化：早期由地缘政治冲突等因素主导的定价逻辑逐步淡化，国内资金面的宽松程度已成为当前市场的核心支撑和主要观察维度", "date": "2026-04-10"}, {"speaker": "赵骥", "text": "地缘冲突若再度升级，长端超长端有交易性机会", "date": "2026-04-10"}, {"speaker": "赵骥", "text": "地缘风险对各类资产的影响已逐步钝化，回归国内自身逻辑", "date": "2026-04-10"}, {"speaker": "张晶", "text": "短期内多空因素博弈中情绪面或占据首要位置", "date": "2026-04-10"}, {"speaker": "高喆", "text": "市场对长端情绪已告别谨慎状态，对冲成本降低", "date": "2026-04-10"}, {"speaker": "高喆", "text": "期货基差因子-0.003元，从略偏高位置转向略偏低位置。显示市场对长端告别谨慎情绪，对冲成本转低", "date": "2026-04-10"}, {"speaker": "杨义山", "text": "短期内债市定价或主要受外部情绪传导及长端换券因素影响", "date": "2026-04-10"}, {"speaker": "杨义山", "text": "后续曲线走向取决于税期前后资金面修正幅度及外部市场情绪传导", "date": "2026-04-10"}, {"speaker": "李博良", "text": "市场情绪相对偏平", "date": "2026-04-10"}, {"speaker": "李博良", "text": "市场对美伊冲突的再钝化趋势明显...短期对通胀交易趋于钝化", "date": "2026-04-10"}, {"speaker": "张帆", "text": "当前市场分歧较大，外部冲突的不确定性对交易有扰动，但后续影响或趋于自动化", "date": "2026-04-10"}, {"speaker": "孔祥雨", "text": "美伊冲突对债市最尖锐影响已过，当前债市情绪与机构行为主导市场定价", "date": "2026-04-10"}, {"speaker": "孔祥雨", "text": "美伊冲突作为前期交易热点，其对国内债市最尖锐的影响时段已过，后续更多是通过股债跷跷板、机构行为及资本流向等形式渐进式、反复递进地淡化", "date": "2026-04-10"}, {"speaker": "刘曼沁", "text": "当前情绪正从追逐短端，切向等待曲线趋平和长端性价比修复", "date": "2026-04-10"}, {"speaker": "李博良", "text": "市场更倾向于震荡偏多，但从当前观察来看，操作时机并不理想", "date": "2025-04-25"}, {"speaker": "李博良", "text": "市场更倾向于震荡偏多，但从当前观察来看，操作时机并不理想", "date": "2025-05-23"}, {"speaker": "张晶", "text": "季末、半年末银行因考核压力可能引发的操作扰动", "date": "2025-06-13"}, {"speaker": "刘曼沁", "text": "10Y前低约在1.65，目前仍未突破", "date": "2 e": "2026-04-17"}, {"speaker": "姜之媛", "text": "基金在中长债券上的敞口暴露已回到两位数、但距极值最高位仍有一定距离，30年或还有一些空间", "date": "2026-04-17"}, {"speaker": "张帆", "text": "一直看好10年国开，目前所有账户的10年国开比例均已达到10%以上", "date": "2026-04-17"}, {"speaker": "孔祥雨", "text": "30年国债、10年国开、15～20年地方债本质上都是对当前曲线陡峭度的修正，均可适量配置", "date": "2026-04-17"}, {"speaker": "李博良", "text": "市场走势略超预期，短期资金宽松支撑不变，等待成本过高导致被动式拉久期", "date": "2026-04-17"}, {"speaker": "孔祥雨", "text": "今年市场的复杂性和多变性使得依赖去年的趋势交易策略变得困难", "date": "2025-04-11"}], "IB_001→IB_002": [{"speaker": "项墩伟", "text": "目前3Y及5YAAA-二债利差均处于近一年63%左右分位数，短线看则处于20日均值下方（中性信号）", "date": "2026-04-03"}, {"speaker": "张帆", "text": "同时关注二永债本季度可能的调整机会，若出现回调则性价比相对突出", "date": "2026-04-03"}, {"speaker": "张帆", "text": "不对抗趋势严控久期。短端套息空间罕见（存单1.66%-1.67%信用1.8%资金1.4%-1.5%），与2017年相似。长久期利率难获利，信用以短端套息为主。", "date": "2025-08-28"}], "IB_001→IB_005": [{"speaker": "柴颖颖", "text": "机构行为分歧较大，部分头部基金公司如华夏基金明确看好今年债市，但也有基金经理明确表示不再进一步提升久期", "date": "2026-04-10"}, {"speaker": "李云增", "text": "核心路径为从行为记录出发，逐步实现行为分析、风险控制、关键行为拆解与指标管理", "date": "2025-05-09"}], "IB_012→IB_002": [{"speaker": "项墩伟", "text": "目前3Y及5YAAA-二债利差均处于近一年63%左右分位数，短线看则处于20日均值下方（中性信号）", "date": "2026-04-03"}, {"speaker": "张帆", "text": "同时关注二永债本季度可能的调整机会，若出现回调则性价比相对突出", "date": "2026-04-03"}, {"speaker": "张帆", "text": "不对抗趋势严控久期。短端套息空间罕见（存单1.66%-1.67%信用1.8%资金1.4%-1.5%），与2017年相似。长久期利率难获利，信用以短端套息为主。", "date": "2025-08-28"}], "IB_003→IB_001": [{"speaker": "姜之媛", "text": "本周机构行为上调至4分", "date": "2026-04-17"}, {"speaker": "孔祥雨", "text": "整体偏多，机构行为打4分，二永配置区间由4～5年收缩至3年附近", "date": "2026-04-17"}, {"speaker": "李博良", "text": "研究员给出的杠杆数据和测算久期数据尚未到非常亢奋的点，微观层面支持曲线仍在走平", "date": "2026-04-17"}, {"speaker": "赵骥", "text": "公募久期快速下降反映谨慎。基本面无实质改善则估值回归。应注重固收+策略设计，探索多元化投资方式。避免过度追涨，等待跌出来的配置机会。", "date": "2025-07-29"}, {"speaker": "赵骥", "text": "理财子回避拉久期公募降久期。安全垫消耗严重基本面定价失效。低利率环境下5bp波动即显著冲击净值。严守安全垫积累原则，通过定制化周报心理按摩，待企稳后重启基本面定价。", "date": "2025-08-15"}, {"speaker": "赵骥", "text": "银行自营为完成KPI涌入可转债导致泡沫化。债市核心在估值过高。存款搬家第一阶段机构外流第二阶段居民滞后。债市需跌出价值。信用优于利率，严控含权仓位。年底机构求稳。", "date": "2025-08-28"}, {"speaker": "李博良", "text": "宽幅震荡1.8%附近有赔率但空头主导。央行托底+配置盘减缓上行。信用债偏空。少犯错优于博收益。", "date": "2025-09-12"}], "IB_013→IB_005": [{"speaker": "柴颖颖", "text": "机构行为分歧较大，部分头部基金公司如华夏基金明确看好今年债市，但也有基金经理明确表示不再进一步提升久期", "date": "2026-04-10"}, {"speaker": "李云增", "text": "核心路径为从行为记录出发，逐步实现行为分析、风险控制、关键行为拆解与指标管理", "date": "2025-05-09"}], "IB_013→IB_001": [{"speaker": "姜之媛", "text": "本周机构行为上调至4分", "date": "2026-04-17"}, {"speaker": "孔祥雨", "text": "整体偏多，机构行为打4分，二永配置区间由4～5年收缩至3年附近", "date": "2026-04-17"}, {"speaker": "李博良", "text": "研究员给出的杠杆数据和测算久期数据尚未到非常亢奋的点，微观层面支持曲线仍在走平", "date": "2026-04-17"}, {"speaker": "赵骥", "text": "公募久期快速下降反映谨慎。基本面无实质改善则估值回归。应注重固收+策略设计，探索多元化投资方式。避免过度追涨，等待跌出来的配置机会。", "date": "2025-07-29"}, {"speaker": "赵骥", "text": "理财子回避拉久期公募降久期。安全垫消耗严重基本面定价失效。低利率环境下5bp波动即显著冲击净值。严守安全垫积累原则，通过定制化周报心理按摩，待企稳后重启基本面定价。", "date": "2025-08-15"}, {"speaker": "赵骥", "text": "银行自营为完成KPI涌入可转债导致泡沫化。债市核心在估值过高。存款搬家第一阶段机构外流第二阶段居民滞后。债市需跌出价值。信用优于利率，严控含权仓位。年底机构求稳。", "date": "2025-08-28"}, {"speaker": "李博良", "text": "宽幅震荡1.8%附近有赔率但空头主导。央行托底+配置盘减缓上行。信用债偏空。少犯错优于博收益。", "date": "2025-09-12"}], "IB_004→IB_012": [{"speaker": "项墩伟", "text": "二永方面关注下周开始的新发，目前工行、中信、招商均有发行计划，若供给阶段性扰动下二永有所调整，可以适当关注逢高配置机会", "date": "2026-04-03"}, {"speaker": "武玥", "text": "若资金面持续宽松，市场或从避险需求或油价高位可能引发衰退的更长逻辑出发，被动配置资产以获取收益", "date": "2026-04-03"}, {"speaker": "柴颖颖", "text": "但内需修复预期与机构再平衡行为或推动收益率曲线动态调整", "date": "2026-04-03"}, {"speaker": "柴颖颖", "text": "若内需呈现逐级修复态势，收益率曲线尤其是短端可能因机构行为（配置户、理财户等）或不同类型资产再平衡过程而需要动态调整", "date": "2026-04-03"}, {"speaker": "王本浩", "text": "二永债新发或带来阶段性布局窗口", "date": "2026-04-03"}, {"speaker": "张帆", "text": "二季度初配置力量显著增强，一季度存款资金释放后委托人欠配压力较大，资金投放力度强劲", "date": "2026-04-03"}, {"speaker": "刘曼沁", "text": "大行购债并未明显加码，长端配置力量仍偏克制，机构行为呈现\"回补短端、观望长端\"的特征", "date": "2026-04-03"}, {"speaker": "李博良", "text": "机构配置情绪强劲支撑债市，短端利率处历史低位但下行空间有限", "date": "2026-04-03"}, {"speaker": "李博良", "text": "从基金申购及一二级交易行为观察，机构配置情绪显著增强，资产端虽难见大幅下行趋势，但在组合具备安全垫前提下仍愿意参与曲线走平交易", "date": "2026-04-03"}, {"speaker": "张晶", "text": "机构行为分化明显，市场对后市判断存在谨慎与乐观的分歧", "date": "2026-04-10"}, {"speaker": "张迪", "text": "农行和中信等大行近期提价发行存单，城商行发行情况也较为积极", "date": "2025-03-10"}, {"speaker": "赵骥", "text": "银行可能会选择获利了结一些FTP倒挂的资产", "date": "2025-06-13"}, {"speaker": "李博良", "text": "整体偏多，资产上关注前期涨幅较小品种的补涨机会，信用短期内性价比高于利率。存单当前价格合理，R001若稳定在1.4%附近短端预计平稳。赎回压力不大，银行配置需求仍在。维持较高久期，看好3-5Y中等资质信用和ETF长端信用债。", "date": "2025-07-04"}, {"speaker": "姜之媛", "text": "7月行情整体偏乐观但赔率不足。1.6%为短期市场底难突破。跨季后银行配置力量回归。操作更考验择券细节和交易心态。已从防守调整到积极，从短久期高杠杆转向长久期低杠杆。小仓位高频次交易无法避免，需管理好交易心态。", "date": "2025-07-04"}, {"speaker": "张帆", "text": "信用债维持看多，理财规模增加背景下资产荒未变，有正套空间。央行7月以来持续回收流动性，存单和超长债性价比降低，存单和超长债选择减仓。信用债维持正套杠杆操作，信用拉久期性价比较高。", "date": "2025-07-04"}, {"speaker": "张帆", "text": "策略维持原有框架不变。对今日反弹力度失望。8月持谨慎态度，中长久期配置条件不充分。信用资产控制久期基础上储备特定资产，赎回扭转后通过20Y品种捕捉机会。保持防御性策略。", "date": "2025-07-29"}, {"speaker": "项敦伟", "text": "1.75-1.8为配置盘加仓窗口。赎回压力边际缓解，配置盘力量增强。30Y国债1.98和地方债2.1-2.2具备配置价值。情绪驱动仍为波动主因，需警惕脉冲扰动。", "date": "2025-07-29"}, {"speaker": "李博良", "text": "逆风但不过度悲观。数据弱+央行配合支撑。配置盘vs交易盘定价逻辑分化。把握曲线陡峭化3-5年中短端可配置，信用防御集中于短端。", "date": "2025-08-15"}, {"speaker": "项墩伟", "text": "本周债券市场机构行为呈现结构性分化，配置需求依然存在但交易活跃度不高，市场在央行合意区间内维持震荡格局。", "date": "2025-11-21"}], "IB_006→IB_012": [{"speaker": "项墩伟", "text": "二永方面关注下周开始的新发，目前工行、中信、招商均有发行计划，若供给阶段性扰动下二永有所调整，可以适当关注逢高配置机会", "date": "2026-04-03"}, {"speaker": "武玥", "text": "若资金面持续宽松，市场或从避险需求或油价高位可能引发衰退的更长逻辑出发，被动配置资产以获取收益", "date": "2026-04-03"}, {"speaker": "柴颖颖", "text": "但内需修复预期与机构再平衡行为或推动收益率曲线动态调整", "date": "2026-04-03"}, {"speaker": "柴颖颖", "text": "若内需呈现逐级修复态势，收益率曲线尤其是短端可能因机构行为（配置户、理财户等）或不同类型资产再平衡过程而需要动态调整", "date": "2026-04-03"}, {"speaker": "王本浩", "text": "二永债新发或带来阶段性布局窗口", "date": "2026-04-03"}, {"speaker": "张帆", "text": "二季度初配置力量显著增强，一季度存款资金释放后委托人欠配压力较大，资金投放力度强劲", "date": "2026-04-03"}, {"speaker": "刘曼沁", "text": "大行购债并未明显加码，长端配置力量仍偏克制，机构行为呈现\"回补短端、观望长端\"的特征", "date": "2026-04-03"}, {"speaker": "李博良", "text": "机构配置情绪强劲支撑债市，短端利率处历史低位但下行空间有限", "date": "2026-04-03"}, {"speaker": "李博良", "text": "从基金申购及一二级交易行为观察，机构配置情绪显著增强，资产端虽难见大幅下行趋势，         navigationButtons: true,
        keyboard: true
      },
      layout: {
        improvedLayout: true
      },
      manipulation: {
        enabled: false
      }
    };

    network = new vis.Network(container, { nodes: nodesDataset, edges: edgesDataset }, options);
    console.log('[五因子] Graph initialized successfully with', NODES.length, 'nodes and', EDGES.length, 'edges');

    // 等待布局稳定后自动适配视口（关键！否则57节点可能飞出可视区域）
    network.once('stabilized', function() {
      network.fit({ animation: { duration: 500, easingFunction: 'easeInOutQuad' } });
      console.log('[五因子] Layout stabilized, viewport fitted');
    });

    // 绑定交互事件（必须在 network 创建后）
    network.on('click', function(params) {
      if (params.nodes.length > 0) {
        updateDetail(params.nodes[0]);
      } else {
        updateDetail(null);
      }
    });
  } catch(e) {
    console.error('[五因子] Graph init error:', e);
    const errDiv = document.createElement('div');
    errDiv.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#ffebee;padding:20px;border-radius:8px;border:2px solid #c62828;text-align:center;font-size:14px;z-index:100;max-width:500px;';
    errDiv.innerHTML = '<b style="color:#c62828">图谱初始化失败</b><br><span style="color:#666">' + e.message + '</span>';
    container.parentElement.appendChild(errDiv);
  }
}

// ========== 交互事件 ==========
function updateDetail(nodeId) {
  const panel = document.getElementById('detailPanel');
  if (!nodeId) {
    panel.innerHTML = '<div class="empty">点击任意节点查看详情</div>';
    return;
  }
  const fid = NODE_ID_MAP[nodeId];
  const node = RAW_DATA.nodes[fid];
  if (!node) { panel.innerHTML = '<div class="empty">无法找到节点信息</div>'; return; }
  
  let html = `<div style="margin-bottom:6px;"><b style="font-size:15px;">${node.label}</b> <span style="color:#888;font-size:12px;">(${fid})</span></div>`;
  html += `<div class="item"><span class="label">一级因子</span><br><span class="val">${node.primary}</span></div>`;
  html += `<div class="item"><span class="label">纪要出现频次</span><br><span class="val">${node.cooccurrence_count || 0}次</span></div>`;
  html += `<div class="item"><span class="label">一级出现次数</span><br><span class="val">${node.appearance_count || 0}次</span></div>`;
  html += `<div class="item"><span class="label">涉及会议</span><br><span class="val">${node.meeting_count || 0}场</span></div>`;
  
  // 入边（被什么影响）
  const inEdges = RAW_DATA.edges.filter(e => e.target === fid);
  if (inEdges.length > 0) {
    html += `<div style="margin-top:8px;"><b>← 前置原因 (${inEdges.length}条)</b></div>`;
    inEdges.sort((a,b) => b.support_count - a.support_count).slice(0, 6).forEach(e => {
      const s = e.strength === 'strong' ? '强' : e.strength === 'medium' ? '中' : '弱';
      html += `<div class="item">${e.source_label} → (${s}/${e.sign}/${e.lag}/${e.support_count}条)`;
      if (e.mechanism) html += `<br><span style="color:#888;font-size:11px;">${e.mechanism}</span>`;
      html += `</div>`;
    });
    if (inEdges.length > 6) html += `<div style="color:#888;font-size:11px;">... 还有${inEdges.length - 6}条</div>`;
  }
  
  // 出边（影响什么）
  const outEdges = RAW_DATA.edges.filter(e => e.source === fid);
  if (outEdges.length > 0) {
    html += `<div style="margin-top:8px;"><b>→ 下游传导 (${outEdges.length}条)</b></div>`;
    outEdges.sort((a,b) => b.support_count - a.support_count).slice(0, 6).forEach(e => {
      const s = e.strength === 'strong' ? '强' : e.strength === 'medium' ? '中' : '弱';
      html += `<div class="item">→ ${e.target_label} (${s}/${e.sign}/${e.lag}/${e.support_count}条)`;
      if (e.mechanism) html += `<br><span style="color:#888;font-size:11px;">${e.mechanism}</span>`;
      html += `</div>`;
    });
    if (outEdges.length > 6) html += `<div style="color:#888;font-size:11px;">... 还有${outEdges.length - 6}条</div>`;
  }
  
  panel.innerHTML = html;
}

// ========== 跳转 ==========
function focusNode(idx) {
  if (!idx || !network) return;
  network.focus(idx, { scale: 1.8, animation: { duration: 500, easingFunction: 'easeInOutQuad' } });
  network.selectNodes([idx]);
  updateDetail(idx);
}

// ========== 搜索 ==========
function searchNode(keyword) {
  if (!nodesDataset) return;
  if (!keyword.trim()) {
    nodesDataset.forEach(function(n) { nodesDataset.update({ id: n.id, hidden: false }); });
    return;
  }
  const kw = keyword.toLowerCase();
  nodesDataset.forEach(function(n) {
    const fid = NODE_ID_MAP[n.id];
    const node = RAW_DATA.nodes[fid];
    const match = node.label.toLowerCase().includes(kw) || 
                  fid.toLowerCase().includes(kw) ||
                  node.primary.toLowerCase().includes(kw);
    nodesDataset.update({ id: n.id, hidden: !match });
  });
}

// ========== 视图模式 ==========
function setViewMode(mode) {
  if (!nodesDataset || !edgesDataset) return;
  currentView = mode;
  document.querySelectorAll('.btn-group button').forEach(b => b.classList.remove('active'));
  document.getElementById('view' + mode.charAt(0).toUpperCase() + mode.slice(1)).classList.add('active');
  
  let visibleNodes = new Set();
  let visibleEdges = [];
  
  if (mode === 'all') {
    // 显示所有
    nodesDataset.forEach(n => nodesDataset.update({ id: n.id, hidden: false }));
    edgesDataset.forEach(e => edgesDataset.update({ id: e.id, hidden: false }));
    network.setOptions({ physics: true });
    return;
  }
  
  edgesDataset.forEach(function(e) {
    let show = true;
    const edgeData = EDGES.find(ed => ed.from === e.from && ed.to === e.to);
    if (!edgeData) return;
    
    // 查找原始边数据
    const rawEdgeIdx = EDGES.indexOf(edgeData);
    const rawEdge = RAW_DATA.edges[rawEdgeIdx];
    if (!rawEdge) return;
    
    if (mode === 'cross' && !rawEdge.cross) show = false;
    if (mode === 'strong' && rawEdge.strength !== 'strong') show = false;
    if (mode === 'reviewed' && rawEdge.review_status !== '已审核') show = false;
    
    if (show) {
      visibleEdges.push(e);
      visibleNodes.add(e.from);
      visibleNodes.add(e.to);
    }
  });
  
  // 更新可见性
  nodesDataset.forEach(function(n) {
    nodesDataset.update({ id: n.id, hidden: !visibleNodes.has(n.id) });
  });
  edgesDataset.forEach(function(e) {
    edgesDataset.update({ id: e.id, hidden: true });
  });
  visibleEdges.forEach(function(e) {
    edgesDataset.update({ id: e.id, hidden: false });
  });
}

// ========== 反向溯源 ==========
function traceBackward(idx) {
  if (!idx || !network) return;
  const fid = NODE_ID_MAP[idx];
  const targetLabel = RAW_DATA.nodes[fid].label;
  
  // BFS 找所有前置路径（最多3层）
  let visited = new Set();
  let queue = [[fid, 0, []]];  // [factor_id, depth, path]
  let paths = [];
  
  while (queue.length > 0) {
    const [cur, depth, path] = queue.shift();
    if (depth >= 3) continue;
    
    const inEdges = RAW_DATA.edges.filter(e => e.target === cur);
    for (const e of inEdges) {
      const newPath = [...path, e];
      const src = e.source;
      // 检查循环（用加入前的path检查，避免e自身被误判）
      if (path.some(p => p.source === src || p.target === src)) continue;
      paths.push(newPath);
      if (!visited.has(src)) {
        visited.add(src);
        queue.push([src, depth + 1, newPath]);
      }
    }
  }
  
  // 按支撑数排序
  paths.sort((a, b) => {
    const sa = a.reduce((s, e) => s + e.support_count, 0);
    const sb = b.reduce((s, e) => s + e.support_count, 0);
    return sb - sa;
  });
  
  // 聚焦目标节点，高亮路径
  network.focus(idx, { scale: 1.5, animation: { duration: 800, easingFunction: 'easeInOutQuad' } });
  
  // 显示结果
  const panel = document.getElementById('detailPanel');
  let html = `<div style="margin-bottom:8px;"><b style="font-size:15px;color:#283593;">反向溯源: ${targetLabel}</b></div>`;
  html += `<div style="color:#666;font-size:12px;margin-bottom:8px;">找到 ${paths.length} 条前置因果路径</div>`;
  
  if (paths.length === 0) {
    html += `<div class="empty">该因子没有前置原因（或已到达根节点）</div>`;
  } else {
    html += `<div style="max-height:200px;overflow-y:auto;">`;
    paths.slice(0, 10).forEach((path, pi) => {
      const totalSupport = path.reduce((s, e) => s + e.support_count, 0);
      html += `<div style="margin-bottom:6px;padding:6px;background:#f5f5ff;border-radius:4px;">`;
      html += `<span style="font-size:11px;color:#888;">路径${pi+1} (支撑${totalSupport}条)</span><br>`;
      const steps = path.map(e => `${e.source_label}<span style="color:#e65100;font-size:10px;">→</span>`);
      steps.push(targetLabel);
      html += `<span style="font-size:12px;">${steps.join('')}</span>`;
      path.forEach(e => {
        html += `<div style="font-size:11px;color:#888;padding-left:10px;">${e.mechanism || ''}</div>`;
      });
      html += `</div>`;
    });
    html += `</div>`;
  }
  
  panel.innerHTML = html;
}

// ========== 正向传导 ==========
function traceForward(idx) {
  if (!idx || !network) return;
  const fid = NODE_ID_MAP[idx];
  const sourceLabel = RAW_DATA.nodes[fid].label;
  
  let visited = new Set();
  let queue = [[fid, 0, []]];
  let paths = [];
  
  while (queue.length > 0) {
    const [cur, depth, path] = queue.shift();
    if (depth >= 3) continue;
    
    const outEdges = RAW_DATA.edges.filter(e => e.source === cur);
    for (const e of outEdges) {
      const newPath = [...path, e];
      const tgt = e.target;
      if (path.some(p => p.source === tgt || p.target === tgt)) continue;
      paths.push(newPath);
      if (!visited.has(tgt)) {
        visited.add(tgt);
        queue.push([tgt, depth + 1, newPath]);
      }
    }
  }
  
  paths.sort((a, b) => {
    const sa = a.reduce((s, e) => s + e.support_count, 0);
    const sb = b.reduce((s, e) => s + e.support_count, 0);
    return sb - sa;
  });
  
  network.focus(idx, { scale: 1.5, animation: { duration: 800, easingFunction: 'easeInOutQuad' } });
  
  const panel = document.getElementById('detailPanel');
  let html = `<div style="margin-bottom:8px;"><b style="font-size:15px;color:#2e7d32;">正向传导: ${sourceLabel}</b></div>`;
  html += `<div style="color:#666;font-size:12px;margin-bottom:8px;">找到 ${paths.length} 条下游传导路径</div>`;
  
  if (paths.length === 0) {
    html += `<div class="empty">该因子没有下游传导路径</div>`;
  } else {
    html += `<div style="max-height:200px;overflow-y:auto;">`;
    paths.slice(0, 10).forEach((path, pi) => {
      const totalSupport = path.reduce((s, e) => s + e.support_count, 0);
      html += `<div style="margin-bottom:6px;padding:6px;background:#f0fff4;border-radius:4px;">`;
      html += `<span style="font-size:11px;color:#888;">路径${pi+1} (支撑${totalSupport}条)</span><br>`;
      const steps = [sourceLabel];
      path.forEach(e => steps.push(`<span style="color:#2e7d32;font-size:10px;">→</span>${e.target_label}`));
      html += `<span style="font-size:12px;">${steps.join('')}</span>`;
      path.forEach(e => {
        html += `<div style="font-size:11px;color:#888;padding-left:10px;">${e.mechanism || ''}</div>`;
      });
      html += `</div>`;
    });
    html += `</div>`;
  }
  
  panel.innerHTML = html;
}

// ========== 发言人视角 ==========
const FACTOR_COLORS = {"基本面因子":"#E65100","政策面因子":"#1565C0","流动性因子":"#2E7D32","市场情绪因子":"#C62828","机构行为因子":"#6A1B9A","市场数据输出":"#D84315"};
let activeSpeaker = null;
let speakerEdgeKeySet = new Set();  // 当前发言人高亮的边 key 集合 "visFrom-visTo"

function selectSpeaker(speakerName) {
  if (!speakerName) { clearSpeakerView(); return; }
  activeSpeaker = speakerName;

  // 1. 构建该发言人关联的边集合
  const speakerEdges = SPEAKER_EDGE_DATA[speakerName] || [];
  speakerEdgeKeySet = new Set();
  const visibleNodeIds = new Set();

  speakerEdges.forEach(se => {
    const key = String(se.from) + '-' + String(se.to);
    speakerEdgeKeySet.add(key);
    visibleNodeIds.add(String(se.from));
    visibleNodeIds.add(String(se.to));
  });

  // 2. 更新节点可见性（高亮的节点增强边框，其他隐藏）
  nodesDataset.forEach(n => {
    const inSet = visibleNodeIds.has(n.id);
    nodesDataset.update({
      id: n.id,
      hidden: !inSet,
      borderWidth: inSet ? 4 : 2,
      size: inSet ? (n.size || 20) + 4 : (n.size || 20),
    });
  });

  // 3. 更新边可见性与样式（高亮边加粗变色，其他隐藏）
  edgesDataset.forEach(e => {
    const key = e.from + '-' + e.to;
    const isHighlight = speakerEdgeKeySet.has(key);
    edgesDataset.update({
      id: e.id,
      hidden: !isHighlight,
      width: isHighlight ? 5 : 2,
      color: isHighlight ? {
        color: '#6A1B9A',
        opacity: 0.95,
        highlight: '#6A1B9A',
      } : (e.color || {}),
    });
  });

  // 4. 渲染发言人画像卡
  renderPersonaCard(speakerName, speakerEdges);

  // 5. 更新右下角 detail panel
  renderSpeakerSummary(speakerName, speakerEdges, visibleNodeIds);
}

  }

  let card = '<div class="persona-card">';

  card += '<div class="persona-stat"><span class="label">观点总数</span><br><span class="val">' + persona.total_claims + '</span></div>';
  card += '<div class="persona-stat"><span class="label">擅长因子</span><br><span class="val" style="color:' + (FACTOR_COLORS[persona.top_factor]||'#333') + ';font-size:12px;">' + persona.top_factor + '</span></div>';

  }
  card += '</div>';

  // 因子偏好分布条（带点击跳转）
  if (persona.factor_preference) {
    card += '<div style="font-size:11px;color:#888;margin-bottom:4px;">因子偏好分布</div>';
    const sorted = Object.entries(persona.factor_preference).sort((a,b) => b[1].count - a[1].count);
    sorted.forEach(([factor, info]) => {

      const pct = info.pct || 0;
      card += '<div style="display:flex;align-items:center;gap:6px;margin-bottom:3px;">';
      card += '<span style="width:50px;font-size:11px;color:#555;flex-shrink:0;">' + factor.slice(0,4) + '</span>';
      card += '<div class="persona-bar" style="flex:1;"><div class="persona-bar-fill" style="width:' + Math.min(pct, 100) + '%;background:' + color + ';"></div></div>';
      card += '<span style="font-size:10px;color:#888;width:42px;text-align:right;">' + info.count + '(' + pct + '%)</span>';

    });

  // 观点类型分布
  if (persona.claim_type_dist && persona.dominant_claim_type) {
    card += '<div style="font-size:11px;color:#888;margin-top:8px;margin-bottom:4px;">观点类型（主打: ' + persona.dominant_claim_type + '）</div>';
    const types = Object.entries(persona.claim_type_dist).sort((a,b) => b[1].count - a[1].count);
    types.slice(0, 5).forEach(([type, info]) => {
      const isDom = type === persona.dominant_claim_type;
      card += '<span style="display:inline-block;margin-right:6px;font-size:11px;padding:1px 4px;border-radius:3px;' +
        (isDom ? 'background:#6A1B9A;color:#fff;' : 'background:#f5f5f5;color:#555;') + '">' +
        type + ' ' + info.count + '</span>';
    });
  }

  // 方向判断偏好
  if (persona.direction_dist) {
    card += '<div style="font-size:11px;color:#888;margin-top:8px;margin-bottom:4px;">方向判断偏好</div>';
    const dColors = {"利多":"#2e7d32","利空":"#c62828","中性":"#1565c0","不明确":"#999"};
    card += '<div style="display:flex;gap:8px;">';
    Object.entries(persona.direction_dist).sort((a,b) => b[1] - a[1]).forEach(([dir, cnt]) => {
      card += '<span style="font-size:12px;font-weight:600;color:' + (dColors[dir]||'#333') + ';">' + dir + ' ' + cnt + '</span>';
    });
    card += '</div>';
  }

  // 因果边数量
  if (persona.causal_edges) {
    const ce = persona.causal_edges;
    card += '<div style="font-size:11px;color:#888;margin-top:8px;">';
    card += '因果链: <b>' + (ce.as_source || 0) + '</b>条作为源头 / <b>' + (ce.as_target || 0) + '</b>条作为目标</div>';
  }

  // 关联因果边列表（可点击跳转）
  if (speakerEdges.length > 0) {
    card += '<div style="font-size:11px;color:#888;margin-top:8px;margin-bottom:4px;">关联因果边（点击跳转）</div>';
    card += '<div style="max-height:160px;overflow-y:auto;">';
    speakerEdges.forEach(se => {
      const srcFid = VISID_TO_FID[String(se.from)] || '';
      const tgtFid = VISID_TO_FID[String(se.to)] || '';
      const srcLabel = srcFid ? (RAW_DATA.nodes[srcFid] || {}).label || srcFid : String(se.from);
      const tgtLabel = tgtFid ? (RAW_DATA.nodes[tgtFid] || {}).label || tgtFid : String(se.to);
      const sLabel = se.label || (srcLabel + '→' + tgtLabel);
      const sColor = se.strength >= 0.7 ? '#283593' : se.strength >= 0.4 ? '#e65100' : '#999';
      card += '<div style="font-size:11px;padding:3px 4px;border-bottom:1px dashed #eee;cursor:pointer;" ' +
        'onclick="focusOnEdge(' + se.from + ',' + se.to + ')" ' +
        'onmouseenter="this.style.background='#f0e6f6'" onmouseleave="this.style.background='transparent'">' +
        '<span style="color:' + sColor + ';font-weight:600;">' + sLabel + '</span>' +
        '</div>';
    });
    card += '</div>';
  }

  // 关键观点（代表性原文）
  if (persona.key_claims && persona.key_claims.length > 0) {
    card += '<div style="font-size:11px;color:#888;margin-top:8px;margin-bottom:4px;">代表性观点</div>';
    card += '<div style="max-height:120px;overflow-y:auto;">';
    persona.key_claims.slice(0, 5).forEach(claim => {
      const text = (claim.text || '').slice(0, 100);
      const truncated = (claim.text || '').length > 100;
      card += '<div style="font-size:11px;color:#444;padding:3px 0;border-bottom:1px dashed #eee;">';
      card += text + (truncated ? '...' : '');
      if (claim.factor) card += ' <span style="color:#888;font-size:10px;">[' + claim.factor + ']</span>';
      if (claim.type) card += ' <span style="color:#aaa;font-size:10px;">(' + claim.type + ')</span>';
      card += '</div>';
    });
    card += '</div>';
  }

  card += '</div>';
  container.innerHTML = card;
}

function renderSpeakerSummary(speakerName, speakerEdges, visibleNodeIds) {
  const persona = SPEAKER_PERSONAS.personas.find(p => p.speaker === speakerName);
  const panel = document.getElementById('detailPanel');

  let summary = '<div style="margin-bottom:8px;"><b style="font-size:15px;color:#6A1B9A;">' + speakerName + '</b></div>';
  summary += '<div style="color:#666;font-size:12px;margin-bottom:6px;">高亮 <b>' + speakerEdges.length + '</b> 条因果边，涉及 <b>' + visibleNodeIds.size + '</b> 个因子节点</div>';

  // 标签
  if (persona && persona.tags && persona.tags.length > 0) {
    summary += '<div style="font-size:12px;margin-bottom:6px;">';
    persona.tags.forEach(t => {
      summary += '<span class="badge" style="background:#6A1B9A;margin-right:4px;margin-bottom:2px;">' + t + '</span>';
    });
    summary += '</div>';
  }

  // 该发言人在哪些因子间建立了因果链（按因子分组展示）
  const factorGroups = {};
  speakerEdges.forEach(se => {
    const srcFid = VISID_TO_FID[String(se.from)] || '';
    const tgtFid = VISID_TO_FID[String(se.to)] || '';
    if (srcFid && tgtFid) {
      const srcPrimary = (RAW_DATA.nodes[srcFid] || {}).primary || '未知';
      const tgtPrimary = (RAW_DATA.nodes[tgtFid] || {}).primary || '未知';
      const pairKey = srcPrimary + ' → ' + tgtPrimary;
      if (!factorGroups[pairKey]) factorGroups[pairKey] = 0;
      factorGroups[pairKey]++;
    }
  });
  if (Object.keys(factorGroups).length > 0) {
    summary += '<div style="font-size:11px;color:#888;margin-bottom:4px;">跨因子因果链分布</div>';
    const sorted = Object.entries(factorGroups).sort((a,b) => b[1] - a[1]);
    sorted.slice(0, 6).forEach(([pair, cnt]) => {
      summary += '<div style="font-size:11px;padding:2px 0;">' + pair + ': <b>' + cnt + '</b>条</div>';
    });
  }

  // 发言人原文支撑（从 EDGE_SPEAKER_INDEX 中提取该发言人的原文）
  const speakerQuotes = [];
  for (const [edgeKey, entries] of Object.entries(EDGE_SPEAKER_INDEX)) {
    entries.forEach(entry => {
      if (entry.speaker === speakerName) {
        speakerQuotes.push({ ...entry, edge: edgeKey });
      }
    });
  }
  // 去重并取最新5条
  const uniqueQuotes = [];
  const seenTexts = new Set();
  speakerQuotes.sort((a,b) => (b.date || '').localeCompare(a.date || ''));
  speakerQuotes.forEach(q => {
    if (!seenTexts.has(q.text) && uniqueQuotes.length < 5) {
      seenTexts.add(q.text);
      uniqueQuotes.push(q);
    }
  });
  if (uniqueQuotes.length > 0) {
    summary += '<div style="font-size:11px;color:#888;margin-top:8px;margin-bottom:4px;">最新支撑观点</div>';
    uniqueQuotes.forEach(q => {
      const text = (q.text || '').slice(0, 80);
      const truncated = (q.text || '').length > 80;
      summary += '<div style="font-size:11px;color:#555;padding:2px 0;border-bottom:1px dashed #eee;">';
      summary += text + (truncated ? '...' : '');
      summary += ' <span style="color:#aaa;font-size:10px;">(' + (q.date || '') + ')</span>';
      summary += '</div>';
    });
  }

  summary += '<div style="font-size:11px;color:#aaa;margin-top:8px;">← 左侧工具栏查看完整画像卡</div>';
  panel.innerHTML = summary;
}

// 点击因果边列表项，跳转并聚焦该边
function focusOnEdge(fromId, toId) {
  // 先选中两个端点节点，让 vis.js 高亮连边
  network.selectNodes([String(fromId), String(toId)]);
  // 聚焦到两点中心
  network.focus(String(fromId), { scale: 1.5, animation: { duration: 400 } });
  // 显示该边的详情（从 EDGE_SPEAKER_INDEX 查找）
  const srcFid = VISID_TO_FID[String(fromId)] || '';
  const tgtFid = VISID_TO_FID[String(toId)] || '';
  const edgeKey = srcFid + '→' + tgtFid;
  const entries = EDGE_SPEAKER_INDEX[edgeKey] || [];

  const panel = document.getElementById('detailPanel');
  const srcLabel = srcFid ? (RAW_DATA.nodes[srcFid] || {}).label || srcFid : '';
  const tgtLabel = tgtFid ? (RAW_DATA.nodes[tgtFid] || {}).label || tgtFid : '';

  let html = '<div style="margin-bottom:6px;"><b style="font-size:14px;">' + srcLabel + ' → ' + tgtLabel + '</b></div>';
  html += '<div style="color:#666;font-size:12px;margin-bottom:6px;">(' + edgeKey + ')</div>';

  // 原始因果边详情
  const rawEdge = RAW_DATA.edges.find(e => e.source === srcFid && e.target === tgtFid);
  if (rawEdge) {
    html += '<div style="font-size:12px;margin-bottom:4px;">强度: ' + rawEdge.strength + ' (' + rawEdge.strength_score + ') | 符号: ' + rawEdge.sign + ' | 时滞: ' + rawEdge.lag + '</div>';
    html += '<div style="font-size:12px;color:#555;margin-bottom:6px;">机制: ' + (rawEdge.mechanism || '-') + '</div>';
  }

  // 该发言人对这条边的支撑原文
  if (activeSpeaker) {
    const speakerEntries = entries.filter(e => e.speaker === activeSpeaker);
    if (speakerEntries.length > 0) {
      html += '<div style="font-size:11px;color:#6A1B9A;margin-bottom:4px;">' + activeSpeaker + ' 的支撑观点 (' + speakerEntries.length + '条)</div>';
      speakerEntries.forEach(entry => {
        html += '<div style="font-size:11px;color:#444;padding:3px 0;border-bottom:1px dashed #eee;">';
        html += (entry.text || '').slice(0, 120) + ((entry.text||'').length > 120 ? '...' : '');
        html += ' <span style="color:#aaa;font-size:10px;">(' + (entry.date || '') + ')</span>';
        html += '</div>';
      });
    }
    // 也显示其他发言人的支撑
    const otherEntries = entries.filter(e => e.speaker !== activeSpeaker);
    if (otherEntries.length > 0) {
      html += '<div style="font-size:11px;color:#888;margin-top:6px;margin-bottom:4px;">其他发言人支撑 (' + otherEntries.length + '条)</div>';
      otherEntries.slice(0, 3).forEach(entry => {
        html += '<div style="font-size:11px;color:#888;padding:2px 0;">';
        html += '<b>' + entry.speaker + '</b>: ' + (entry.text || '').slice(0, 60) + '...';
        html += ' <span style="color:#aaa;font-size:10px;">(' + (entry.date || '') + ')</span>';
        html += '</div>';
      });
      if (otherEntries.length > 3) {
        html += '<div style="font-size:10px;color:#aaa;">...还有 ' + (otherEntries.length - 3) + ' 条</div>';
      }
    }
  } else {
    // 没有激活发言人，显示所有支撑
    if (entries.length > 0) {
      html += '<div style="font-size:11px;color:#888;margin-bottom:4px;">支撑观点 (' + entries.length + '条)</div>';
      entries.slice(0, 5).forEach(entry => {
        html += '<div style="font-size:11px;color:#444;padding:2px 0;border-bottom:1px dashed #eee;">';
        html += '<b>' + entry.speaker + '</b>: ' + (entry.text || '').slice(0, 80) + '...';
        html += '</div>';
      });
    }
  }

  panel.innerHTML = html;
}

function clearSpeakerView() {
  activeSpeaker = null;
  speakerEdgeKeySet = new Set();

  // 恢复所有节点和边的可见性（重置到当前视图模式）
  setViewMode(currentView);

  // 重置发言人的样式修改（恢复节点大小和边样式）
  nodesDataset.forEach(n => {
    const origSize = NODES.find(nd => nd.id === n.id);
    nodesDataset.update({
      id: n.id,
      borderWidth: origSize ? 2 : 2,
    });
  });
  edgesDataset.forEach(e => {
    const origEdge = EDGES.find(ed => ed.from === e.from && ed.to === e.to);
    if (origEdge) {
      edgesDataset.update({
        id: e.id,
        width: origEdge.width || 2,
        color: origEdge.color || {},
      });
    }
  });

  document.getElementById('speakerSelect').value = '';
  document.getElementById('personaCardContainer').innerHTML = '';
  document.getElementById('detailPanel').innerHTML = '<div class="empty">点击任意节点查看详情</div>';
}

// ========== 点击节点时的增强：显示该节点的发言人维度 ==========
const origUpdateDetail = updateDetail;
updateDetail = function(nodeId) {
  origUpdateDetail(nodeId);
  if (!nodeId || !activeSpeaker) return;
  // 如果有激活的发言人，在节点详情中追加该发言人对此节点的观点
  const fid = NODE_ID_MAP[nodeId];
  const panel = document.getElementById('detailPanel');
  if (!panel) return;

  // 从 EDGE_SPEAKER_INDEX 查找该发言人关于此节点的原文
  const speakerQuotes = [];
  for (const [edgeKey, entries] of Object.entries(EDGE_SPEAKER_INDEX)) {
    const [src, tgt] = edgeKey.split('→');
    if (src === fid || tgt === fid) {
      entries.forEach(entry => {
        if (entry.speaker === activeSpeaker) {
          speakerQuotes.push({ ...entry, edge: edgeKey, role: src === fid ? '源头' : '目标' });
        }
      });
    }
  }

  if (speakerQuotes.length > 0) {
    speakerQuotes.sort((a,b) => (b.date || '').localeCompare(a.date || ''));
    let extra = '<div style="margin-top:10px;padding-top:8px;border-top:1px solid #e0e0e0;">';
    extra += '<b style="font-size:12px;color:#6A1B9A;">' + activeSpeaker + ' 的相关观点 (' + speakerQuotes.length + '条)</b>';
    extra += '<div style="max-height:100px;overflow-y:auto;margin-top:4px;">';
    speakerQuotes.slice(0, 4).forEach(q => {
      extra += '<div style="font-size:11px;color:#555;padding:2px 0;border-bottom:1px dashed #eee;">';
      extra += '<span style="color:#aaa;">[' + q.role + ' ' + q.edge + ']</span> ';
      extra += (q.text || '').slice(0, 80) + ((q.text||'').length > 80 ? '...' : '');
      extra += ' <span style="color:#aaa;font-size:10px;">(' + (q.date || '') + ')</span>';
      extra += '</div>';
    });
    extra += '</div></div>';
    panel.innerHTML += extra;
  }
};
